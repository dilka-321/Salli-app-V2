   <div class="card glow"><div class="between"><span class="small muted">Remaining Amount</span><button class="ib" data-a="plhide" aria-label="Show or hide">${ic('eye')}</button></div><div class="big num ${rem<0?'red':'green'}">${p.hide?'••••':B(rem)}</div>
   <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:6px">${[['Total Allocated',tot],['Expenses',a.exp],['Loan Payments',a.loan],['Credit Card Payments',a.card],['Saving Goals',a.goal]].map(([l,v])=>`<div class="between small" style="padding:3px 0"><span class="muted">${l}</span><b class="num">${p.hide?'••••':B(v)}</b></div>`).join('')}</div></div>

};

const OTS={worked:['Worked','var(--accent)'],leave:['Leave','var(--orange)'],nopay:['No Pay','var(--red)'],holiday:['Holiday','var(--blue)']};
function hrsBetween(a,b){if(!a||!b)return 0;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d/60}
function otMonth(k){
  const c=S.ot.cfg,log=S.ot.log;const n=daysIn(k);const last=k===ym(today())?D(today()).getDate():k<ym(today())?n:0;
  const days=Array.from({length:n},(_,i)=>k+'-'+pad(i+1));const ent=days.filter(d=>log[d]);
  const cnt={worked:0,leave:0,nopay:0,holiday:0};ent.forEach(d=>cnt[log[d].status]=(cnt[log[d].status]||0)+1);
  const worked=sum(ent.filter(d=>log[d].status==='worked'),d=>hrsBetween(log[d].in,log[d].out));
  const ot=sum(ent,d=>{const e=log[d];if(c.autoOT&&e.status==='worked'&&e.in&&e.out)return Math.max(0,hrsBetween(e.in,e.out)-c.stdHours);return +e.ot||0});
  const missing=days.slice(0,last).filter(d=>!log[d]);
  const hourly=c.basic&&c.workDays&&c.stdHours?c.basic/(c.workDays*c.stdHours):0;
  const otRate=+c.otRate||round2(hourly*1.5);
  const allow=c.allowances.filter(x=>x.name||+x.amount);const ded=c.deductions.filter(x=>x.name||+x.amount);
  const allowSum=sum(allow,x=>x.amount),otPay=ot*otRate,nopay=c.workDays?c.basic/c.workDays*cnt.nopay:0;
  const gross=+c.basic+allowSum+otPay-nopay;const epfBase=+c.basic+sum(allow.filter(x=>x.epf),x=>x.amount)-nopay;
  const epf=epfBase*(+c.epf||0)/100,etf=epfBase*(+c.etf||0)/100,dedSum=sum(ded,x=>x.amount);
  return {n,days,ent,cnt,worked,ot,missing,otRate,allow,ded,allowSum,otPay,nopay,gross,epf,etf,dedSum,net:gross-epf-dedSum,hourly};
}

/* ---------------- Recurring ---------------- */
/* Recurring expenses are paid manually with "Make Payment"; due dates that pass unpaid count as missed periods. */
function nextRecurring(r,from){if(r.freq==='monthly'){const d=addMonths(from.slice(0,8)+'01',1);return d.slice(0,8)+pad(Math.min(+r.dom||1,daysIn(ym(d))))}return advanceDate(from,r.freq)}
function firstRecurring(r){if(r.freq!=='monthly')return r.start;const k=ym(r.start);let d=k+'-'+pad(Math.min(+r.dom||1,daysIn(k)));if(d<r.start)d=nextRecurring(r,d);return d}
function recMissed(r){let n=0,d=r.next;const t=today();while(d&&d<t&&n<999){n++;d=nextRecurring(r,d)}return n}
const PER={daily:'day',weekly:'wk',monthly:'mo',yearly:'yr'};
SCR.recurring=()=>({top:hdr(T('Recurring Expenses')),html:`<div class="pad stack">${S.recurring.map(r=>{const m=recMissed(r);return `<div class="card row"><button class="row grow" style="text-align:left;min-width:0" data-a="go" data-n="recDetail" data-p='{"id":"${r.id}"}'><span class="ic orange" style="font-size:calc(22px*var(--fs))">${cat(r.catId)?.icon||'🔁'}</span><span class="grow" style="min-width:0"><b>${esc(r.title||cat(r.catId)?.name||'Recurring')}</b><div class="tiny muted">${FREQ[r.freq]||'Daily'}${r.freq==='monthly'?' · day '+r.dom:''} · next ${fD(r.next)} · ${esc(accName(r.accId))}</div>${m?`<span class="badge red">${m} missed</span>`:''}</span><b class="num red">${money(r.amount,accCur(r.accId))}</b></button><button class="ib" data-a="recmenu" data-id="${r.id}" aria-label="Options">${ic('more')}</button></div>`}).join('')||emptyState('repeat','No recurring expenses','Track rent, bills and standing orders, and record each payment with Make Payment')}</div>`,fab:fabBtn('recnew',true)});
A.recmenu=el=>{const id=el.dataset.id;const r=S.recurring.find(x=>x.id===id);openMenu(el,[{l:'Make Payment',i:'card',a:()=>recPay(id)},{l:'Edit',i:'edit',a:()=>{U.recE={...r};go('recEdit')}},{l:'Delete',i:'trash',red:true,a:()=>recDelete(id)}])};
function recDelete(id){confirmDel('Delete recurring expense?','Payments you already recorded stay in your transactions.',()=>{S.recurring=S.recurring.filter(x=>x.id!==id);if(cur().n==='recDetail')back();commit('Recurring expense deleted')})}
SCR.recDetail=p=>{const r=S.recurring.find(x=>x.id===p.id);if(!r)return SCR.recurring();const c=accCur(r.accId);const m=recMissed(r);const name=r.title||cat(r.catId)?.name||'Recurring';
  const tile=(i,cl,k,v,vc='',full)=>`<div class="card" ${full?'style="grid-column:1/-1"':''}><span class="ic ${cl}">${ic(i)}</span><div class="tiny muted" style="margin-top:10px">${k}</div><b class="${vc}">${v}</b></div>`;

   html:`<div class="pad stack" style="margin-top:12px"><div class="card"><div class="row"><span class="ic lg blue b">${esc(name[0].toUpperCase())}</span><span><b style="font-size:calc(17px*var(--fs))">${esc(name)}</b><div><span class="badge green">Active</span></div></span></div><div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><b class="blue num" style="font-size:calc(18px*var(--fs))">${money(r.amount,c)}</b> <span class="small muted">/ ${PER[r.freq]||'mo'}</span></div></div>
   <div class="g2">${tile('cal','blue','Next due',fD(r.next),m?'red':'blue')}${tile('repeat','blue','Frequency',FREQ[r.freq]||'Daily')}${tile('money','green','Total paid',money(sum(r.payments,x=>x.amount),c))}${tile('warn',m?'red':'','Missed periods',String(m),m?'red':'')}${tile('cal','','Start date',fD(r.start),'',1)}</div>

   <span class="h2">Payment History</span>${r.payments.length?`<div class="card">${r.payments.slice().reverse().map(x=>`<div class="kv"><span>${fD(x.date)}<div class="tiny muted">${esc(accName(x.accId))}${x.due?' · for '+fD(x.due):''}</div></span><b class="num">${money(x.amount,accCur(x.accId))}</b></div>`).join('')}</div>`:`<div class="card row small muted">${ic('history')} No payments yet. Tap Make Payment to record.</div>`}</div>`,fab:false};

SCR.analyzer=()=>{const z=U.la=U.la||{P:'1000000',r:'14',n:'60',inc:'',extra:''};const P=+z.P||0,r=+z.r||0,n=+z.n||0;
  let out='';if(P>0&&n>0){const e=emiOf({principal:P,rate:r,months:n});const tot=e*n,int=tot-P;
   let bal=P,m=0,int2=0;const ex=+z.extra||0;const rr=r/1200;while(bal>0.01&&m<1200){const it=bal*rr;int2+=it;bal=bal+it-(e+ex);m++}
   const yrs=[];bal=P;for(let y=1;y<=Math.ceil(n/12);y++){let ip=0,pp=0;for(let k=0;k<12&&(y-1)*12+k<n;k++){const it=bal*rr;ip+=it;pp+=e-it;bal=Math.max(0,bal-(e-it))}yrs.push({y,ip,pp,bal})}
   const ratio=+z.inc?e/+z.inc:null;
   out=`<div class="card glow"><span class="small muted">Monthly instalment (EMI)</span><div class="big green num">${B(e)}</div><div class="g2" style="margin-top:10px"><div><span class="tiny muted">Total interest</span><div class="b red num">${B(int)}</div></div><div><span class="tiny muted">Total payable</span><div class="b num">${B(tot)}</div></div></div>
   <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:12px"><i style="width:${P/tot*100}%;background:var(--accent)"></i><i style="width:${int/tot*100}%;background:var(--red)"></i></div><div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Principal ${Math.round(P/tot*100)}%</span><span><i style="background:var(--red)"></i>Interest ${Math.round(int/tot*100)}%</span></div></div>
   ${ratio!=null?`<div class="card row"><span class="ic ${ratio<=.3?'green':ratio<=.45?'orange':'red'}">${ic('shield')}</span><span><b>EMI is ${Math.round(ratio*100)}% of your income</b><div class="small muted">${ratio<=.3?'Comfortable — under the common 30% guideline.':ratio<=.45?'Manageable, but leaves less room for savings.':'High — consider a longer tenure or a smaller loan.'}</div></span></div>`:''}
   ${ex>0?`<div class="card"><b>Paying ${B(ex)} extra each month</b><div class="kv"><span>Paid off in</span><b>${m} months (${n-m} sooner)</b></div><div class="kv"><span>Interest saved</span><b class="green num">${B(Math.max(0,int-int2))}</b></div></div>`:''}
   <div class="card" style="overflow-x:auto"><b>Yearly breakdown</b><table style="width:100%;font-size:calc(12px*var(--fs));border-collapse:collapse;margin-top:8px"><tr class="muted"><td>Year</td><td style="text-align:right">Principal</td><td style="text-align:right">Interest</td><td style="text-align:right">Balance</td></tr>${yrs.map(x=>`<tr><td style="padding:5px 0">${x.y}</td><td class="num" style="text-align:right">${compact(x.pp)}</td><td class="num red" style="text-align:right">${compact(x.ip)}</td><td class="num" style="text-align:right">${compact(x.bal)}</td></tr>`).join('')}</table></div>`}
  const f=(k,l,ph)=>`<div class="fld"><label for="la_${k}">${l}</label><input id="la_${k}" inputmode="decimal" placeholder="${ph||''}" value="${esc(z[k])}" data-in="laf" data-k="${k}"></div>`;
  return {top:hdr(T('Loan Analyzer')),html:`<div class="pad stack"><div class="card stack">${f('P','Loan amount')}<div class="g2">${f('r','Interest rate (% / year)')}${f('n','Tenure (months)')}</div><div class="g2">${f('inc','Monthly income (optional)')}${f('extra','Extra monthly payment','0')}</div></div>${out}</div>`,fab:false};
};

    if(f.payout==='maturity')post('M',fdMaturity(a),fdMonthly(a)*m);else for(let k=1;k<=m;k++)post(k,addMonths(f.start,k),fdMonthly(a))});

SCR.goal=p=>{const g=S.goals.find(x=>x.id===p.id);if(!g)return SCR.goals();const sv=goalSaved(g),pc=sv/g.target;const ml=g.deadline?Math.max(1,Math.ceil(diffDays(today(),g.deadline)/30)):0;

   <div class="g2"><div class="card"><span class="tiny muted">Remaining</span><div class="b num">${B(Math.max(0,g.target-sv))}</div></div><div class="card"><span class="tiny muted">${g.deadline?'Needed per month':'Deadline'}</span><div class="b num">${g.deadline?(pc>=1?'Done':B((g.target-sv)/ml)):'None'}</div></div></div>
   ${g.deadline?`<div class="card small muted row">${ic('cal')} Target date ${fD(g.deadline)} · ${diffDays(today(),g.deadline)>=0?diffDays(today(),g.deadline)+' days left':'passed'}</div>`:''}
   <span class="h2">Contributions</span>${g.contributions.length?`<div class="card">${g.contributions.slice().reverse().map(c=>`<div class="kv"><span>${fD(c.date)}${c.accId?`<div class="tiny muted">from ${esc(accName(c.accId))}</div>`:''}</span><b class="num ${c.amount<0?'red':'green'}">${B(c.amount)}</b></div>`).join('')}</div>`:'<div class="card small muted">No contributions yet.</div>'}</div>`,
   bottom:`<div class="bottombar pad"><div class="btns"><button class="btn out" data-a="goalwd" data-id="${g.id}">Withdraw</button><button class="btn" data-a="goaladd" data-id="${g.id}">${ic('plus',2)} Add Money</button></div></div>`,fab:false};
};
A.goalmenu=el=>{const id=el.dataset.id;const g=S.goals.find(x=>x.id===id);openMenu(el,[{l:'Edit goal',i:'edit',a:()=>goalForm(id)},{l:g.completed?'Mark as active':'Mark as completed',i:'check',a:()=>{g.completed=!g.completed;commit(g.completed?'Goal completed':'Goal reactivated')}},{l:'Delete goal',i:'trash',red:true,a:()=>confirmDel('Delete goal?','',()=>{S.goals=S.goals.filter(x=>x.id!==id);back();commit('Goal deleted')})}])};
function goalMoney(id,sign){const g=S.goals.find(x=>x.id===id);
  openSheet(st=>`<h3>${sign>0?'Add money to':'Withdraw from'} ${esc(g.name)}</h3><div class="fld"><label for="gm_a">Amount (${S.settings.base})</label><input id="gm_a" inputmode="decimal" value="${esc(st.amt)}" data-in="gmf"></div>${accChips(st.accId,'gmacc',{title:sign>0?'Take from account (optional)':'Return to account (optional)',noAdd:true})}<span class="tiny muted">Choosing an account moves the money out of (or back into) that account.</span>${st.err?`<span class="err">${st.err}</span>`:''}<button class="btn w" data-a="gmok">Save</button>`,{id,sign,amt:'',accId:null})}
A.goaladd=el=>goalMoney(el.dataset.id,1);A.goalwd=el=>goalMoney(el.dataset.id,-1);
A.gmf=el=>{topSheet().st.amt=el.value};A.gmacc=el=>{const st=topSheet().st;st.accId=st.accId===el.dataset.id?null:el.dataset.id;rs()};
A.gmok=()=>{const st=topSheet().st;const g=S.goals.find(x=>x.id===st.id);const v=parseFloat(st.amt);if(!(v>0)){st.err='Enter an amount above zero.';rs();return}if(st.sign<0&&v>goalSaved(g)){st.err='You can withdraw up to '+B(goalSaved(g))+'.';rs();return}
  g.contributions.push({id:uid(),amount:v*st.sign,date:today(),accId:st.accId});
  if(st.accId)S.txns.push({id:uid(),type:st.sign>0?'expense':'income',kind:'goal',who:g.name,accId:st.accId,amount:round2(conv(v,S.settings.base,accCur(st.accId))),date:today(),time:nowTime(),note:(st.sign>0?'Saved to ':'Withdrawn from ')+g.name,tags:[]});
  if(goalSaved(g)>=g.target&&!g.completed){g.completed=true;closeSheet();commit('Goal reached! Moved to completed.');return}closeSheet();commit('Goal updated')};

/* ---------------- To-Do ---------------- */

  return {top:hdr(T('To-Do List'),{green:true,right:rbtn('refresh','refresh','','Refresh')}),html:`<div class="tabs" style="background:var(--hdr-green);color:#fff">${[['active','Active','todo'],['done','Completed','check']].map(([v,l,i])=>`<button class="${tb===v?'on':''}" style="color:${tb===v?'#fff':'rgba(255,255,255,.75)'};border-color:${tb===v?'#fff':'transparent'}" data-a="todotab" data-v="${v}">${ic(i)}${l}</button>`).join('')}</div>
   <div class="pad stack" style="margin-top:12px">${L.map(t=>`<div class="card row" style="border-top:3px solid var(--accent)"><button class="chk ${t.done?'on':''}" data-a="todotoggle" data-id="${t.id}" aria-label="${t.done?'Mark not done':'Mark done'}">${t.done?ic('check',3):''}</button><span class="grow"><b style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</b><div><span class="badge green">${esc(t.tag||'Personal')}</span></div>${t.due?`<div class="tiny ${!t.done&&t.due<today()?'red':'muted'} row" style="margin-top:4px">${ic('cal').replace('<svg','<svg style="width:12px;height:12px"')} ${fD(t.due)}</div>`:''}</span><button class="ib" data-a="todomenu" data-id="${t.id}" aria-label="Options">${ic('more')}</button></div>`).join('')
   ||emptyState('todo',tb==='active'?'Nothing to do':'No completed tasks yet',tb==='active'?'Add financial to-dos like paying bills or renewing insurance':'')}</div>`,fab:fabBtn('todonew',true)};
};
A.todotab=el=>{U.todoTab=el.dataset.v;render()};
A.todotoggle=el=>{const t=S.todos.find(x=>x.id===el.dataset.id);t.done=!t.done;commit(t.done?'Marked complete':'Moved to active')};
A.todomenu=el=>{const id=el.dataset.id;openMenu(el,[{l:'Edit',i:'edit',a:()=>todoForm(id)},{l:'Delete',i:'trash',red:true,a:()=>{S.todos=S.todos.filter(x=>x.id!==id);commit('Task deleted')}}])};
A.todonew=()=>todoForm(null);
function todoForm(id){const t=id?S.todos.find(x=>x.id===id):null;openSheet(st=>`<h3>${t?'Edit task':'New task'}</h3><div class="fld"><input id="td_t" placeholder="What needs doing?" value="${esc(st.title)}" data-in="tdf" data-k="title"></div><div class="chips">${['Personal','Work','Finance','Family','Shopping'].map(x=>`<button class="chip soft ${st.tag===x?'on':''}" data-a="tdtag" data-v="${x}">${x}</button>`).join('')}</div><div class="fld"><label for="td_d">Due date</label><input type="date" id="td_d" value="${st.due}" data-ch="tdf" data-k="due"></div><div class="btns"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="tdsave">Save</button></div>`,{id,title:t?t.title:'',tag:t?t.tag:'Personal',due:t?t.due:addDays(today(),1)})}
A.tdf=el=>{topSheet().st[el.dataset.k]=el.value};A.tdtag=el=>{topSheet().st.tag=el.dataset.v;rs()};
A.tdsave=()=>{const st=topSheet().st;if(!st.title.trim()){toast('Enter a task',true);return}const r={title:st.title.trim(),tag:st.tag,due:st.due};if(st.id)Object.assign(S.todos.find(x=>x.id===st.id),r);else S.todos.push({id:uid(),...r,done:false});closeSheet();commit('Task saved')};

/* ---------------- Priority board ---------------- */
const LVL={Low:1,Medium:2,High:3,Critical:4};
SCR.priorities=()=>{const tb=U.prTab||'pending';const L=S.priorities.filter(p=>tb==='pending'?!p.done:p.done).sort((a,b)=>(LVL[b.importance]*LVL[b.urgency])-(LVL[a.importance]*LVL[a.urgency]));
  const q=p=>LVL[p.importance]>=3&&LVL[p.urgency]>=3?['Do first','red']:LVL[p.importance]>=3?['Schedule','blue']:LVL[p.urgency]>=3?['Delegate / quick','orange']:['Later',''];
  return {top:hdr(T('Priority Board'),{right:rbtn('refresh','refresh','','Refresh')}),html:`<div class="tabs">${[['pending','Pending','prio'],['done','Completed','check']].map(([v,l,i])=>`<button class="${tb===v?'on':''}" data-a="prtab" data-v="${v}">${ic(i)}${l}</button>`).join('')}</div>
   <div class="pad stack" style="margin-top:12px">${L.map(p=>{const qq=q(p);return `<div class="card stack s8"><div class="row"><button class="chk ${p.done?'on':''}" data-a="prtoggle" data-id="${p.id}" aria-label="Toggle done">${p.done?ic('check',3):''}</button><b class="grow">${esc(p.title)}</b><span class="badge ${qq[1]}">${qq[0]}</span><button class="ib" data-a="prmenu" data-id="${p.id}" aria-label="Options">${ic('more')}</button></div>${p.desc?`<div class="small muted">${esc(p.desc)}</div>`:''}<div class="chips wrap" style="flex-wrap:wrap"><span class="badge">${esc(p.category)}</span><span class="badge">Importance: ${p.importance}</span><span class="badge">Urgency: ${p.urgency}</span>${+p.cost?`<span class="badge green">${money(p.cost,p.costCur||S.settings.base)}</span>`:''}</div>${p.whyImportant||p.whyUrgent?`<div class="tiny muted">${p.whyImportant?'Important: '+esc(p.whyImportant):''}${p.whyImportant&&p.whyUrgent?' · ':''}${p.whyUrgent?'Urgent: '+esc(p.whyUrgent):''}</div>`:''}</div>`}).join('')
   ||emptyState('prio','',tb==='pending'?'No pending priorities':'No completed priorities')}</div>`,fab:fabBtn('prnew',true)};
};
A.prtab=el=>{U.prTab=el.dataset.v;render()};A.prtoggle=el=>{const p=S.priorities.find(x=>x.id===el.dataset.id);p.done=!p.done;commit()};
A.prmenu=el=>{const id=el.dataset.id;openMenu(el,[{l:'Edit',i:'edit',a:()=>{U.prE={...S.priorities.find(x=>x.id===id)};go('prEdit')}},{l:'Delete',i:'trash',red:true,a:()=>{S.priorities=S.priorities.filter(x=>x.id!==id);commit('Deleted')}}])};
A.prnew=()=>{U.prE={id:null,title:'',desc:'',category:'Other',importance:'Medium',urgency:'Medium',whyImportant:'',whyUrgent:'',cost:'',costCur:S.settings.base};go('prEdit')};
SCR.prEdit=()=>{const e=U.prE;if(!e)return SCR.priorities();const sel=(k,l,opts)=>`<div class="fld"><label for="pe_${k}">${l}</label><select id="pe_${k}" data-ch="pef" data-k="${k}">${opts.map(o=>`<option ${e[k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
  return {top:hdr((e.id?'Edit':'Create')+' Priority',{green:true}),html:`<div class="pad stack" style="margin-top:12px"><label class="iconfield" style="border-color:var(--accent)">${ic('flag')}<span class="grow"><small>Title</small><input id="pe_t" value="${esc(e.title)}" data-in="pef" data-k="title"></span></label>
   <div class="fld"><textarea id="pe_d" placeholder="What is this?" data-in="pef" data-k="desc">${esc(e.desc)}</textarea></div>
   ${sel('category','Category',['Debt','Savings','Bills','Investment','Purchase','Family','Health','Other'])}${sel('importance','Importance',['Low','Medium','High','Critical'])}
   <div class="fld"><textarea id="pe_wi" placeholder="Why is it important?" data-in="pef" data-k="whyImportant">${esc(e.whyImportant)}</textarea></div>${sel('urgency','Urgency',['Low','Medium','High','Critical'])}
   <div class="fld"><textarea id="pe_wu" placeholder="Why is it urgent?" data-in="pef" data-k="whyUrgent">${esc(e.whyUrgent)}</textarea></div>
   <div class="iconfield"><button class="chip soft on" style="flex:none" data-a="pecur" aria-label="Cost currency">${esc(sym(e.costCur||S.settings.base))} ${e.costCur||S.settings.base} ▾</button><span class="grow"><input id="pe_c" inputmode="decimal" placeholder="Estimated Cost" value="${esc(e.cost)}" data-in="pef" data-k="cost"></span></div>${(e.costCur||S.settings.base)!==S.settings.base&&+e.cost?`<span class="tiny green">≈ ${B(conv(+e.cost,e.costCur,S.settings.base))}</span>`:''}
   <button class="btn w" data-a="pesave">${e.id?'Save':'Create'}</button></div>`,fab:false}};
A.pef=el=>{U.prE[el.dataset.k]=el.value};A.pecur=()=>currencyPicker(U.prE.costCur||S.settings.base,c=>{U.prE.costCur=c;render()},'Cost Currency');
A.pesave=()=>{const e=U.prE;if(!e.title.trim()){toast('Enter a title',true);return}const r={...e,title:e.title.trim(),cost:parseFloat(e.cost)||0};if(e.id)Object.assign(S.priorities.find(x=>x.id===e.id),r);else S.priorities.push({...r,id:uid(),done:false});U.prE=null;back();commit('Priority saved')};

SCR.categories=()=>{const k=U.catKind||'income',q=(U.catQ||'').toLowerCase();const mains=S.categories.filter(c=>c.kind===k&&!c.parent&&(!q||c.name.toLowerCase().includes(q)||S.categories.some(s=>s.parent===c.id&&s.name.toLowerCase().includes(q))));
  return {top:hdr(T('Categories')),html:`<div class="pad stack"><div class="seg">${[['income','Income'],['expense','Expense']].map(([v,l])=>`<button class="${k===v?'on':''}" data-a="catkind" data-v="${v}">${l}</button>`).join('')}</div>
   <label class="search">${ic('search')}<input id="catsq" placeholder="Search categories" value="${esc(U.catQ||'')}" data-in="catsq">${U.catQ?`<button class="ib" data-a="catqclear" aria-label="Clear">${ic('x')}</button>`:''}</label>
   <div class="stack">${mains.map((c,i)=>{const subs=S.categories.filter(s=>s.parent===c.id);return `<div class="card" data-ri="${i}" style="border-left:3px solid var(--accent)"><div class="row"><span class="ic lg" style="font-size:calc(26px*var(--fs))">${c.icon}</span><span class="grow"><b>${esc(c.name)}</b>${subs.length?`<div><span class="badge green">${subs.length} subcategor${subs.length>1?'ies':'y'}</span></div>`:''}</span></div>
   ${subs.length?`<div class="chips wrap" style="flex-wrap:wrap;margin-top:8px">${subs.map(s=>`<span class="chip" style="display:inline-flex;align-items:center;gap:6px;color:var(--fg)"><button data-a="catedit" data-id="${s.id}" aria-label="Edit ${esc(s.name)}">${s.icon} ${esc(s.name)}</button><button class="red" data-a="catdel" data-id="${s.id}" aria-label="Delete ${esc(s.name)}" style="display:grid;place-items:center">${ic('trash').replace('<svg width="20" height="20"','<svg width="14" height="14"')}</button></span>`).join('')}</div>`:''}
   <div class="row" style="justify-content:flex-end;gap:4px;margin-top:6px"><button class="ib green" data-a="catedit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">${ic('edit')}</button><button class="ib red" data-a="catdel" data-id="${c.id}" aria-label="Delete ${esc(c.name)}">${ic('trash')}</button><button class="ib drag" data-drag="cats" aria-label="Drag to reorder">${ic('drag')}</button></div></div>`}).join('')||`<p class="muted" style="text-align:center;margin-top:40px">No main categories found</p>`}</div></div>`,fab:fabBtn('catnew',true)};
};
A.catkind=el=>{U.catKind=el.dataset.v;render()};A.catsq=el=>{U.catQ=el.value;render()};A.catqclear=()=>{U.catQ='';render()};
A.catnew=()=>catEditor(U.catKind||'income',null);A.catedit=el=>{const c=cat(el.dataset.id);catEditor(c.kind,c.id)};
A.catdel=el=>{const c=cat(el.dataset.id);const n=S.txns.filter(t=>t.catId===c.id).length;confirmDel(c.parent?'Delete subcategory?':'Delete category?',`"${esc(c.name)}"${n?` is used by ${n} transaction${n>1?'s':''}; they will show without a category`:''}.${c.parent?'':' Subcategories become main categories.'}`,()=>{S.categories.forEach(x=>{if(x.parent===c.id)x.parent=null});S.categories=S.categories.filter(x=>x.id!==c.id);commit('Category deleted')})};
A.reorder_cats=(f,t)=>{const k=U.catKind||'income';const mains=S.categories.filter(c=>c.kind===k&&!c.parent);moveIdx(mains,f,t);const rest=S.categories.filter(c=>!(c.kind===k&&!c.parent));S.categories=[...mains,...rest];commit()};

/* ---------------- Tags ---------------- */
SCR.tags=()=>({top:hdr(T('Tags')),html:`<div class="pad stack">${S.tags.map(t=>`<div class="card row"><span class="ic green">${ic('tag')}</span><b class="grow">${esc(t.name)}</b><button class="ib" data-a="tagedit" data-id="${t.id}" aria-label="Edit">${ic('edit')}</button><button class="ib red" data-a="tagdel" data-id="${t.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('')||emptyState('tag','No tags yet','Tags help you group transactions like "Essential" or "One-time"')}</div>`,fab:fabBtn('tagnew',true)});
function tagDialog(id,after){const t=id?S.tags.find(x=>x.id===id):null;openSheet(st=>`<h3>${t?'Edit tag':'Add tag'}</h3><div class="fld"><label for="tg_n">Tag name</label><input id="tg_n" placeholder="Enter tag name" value="${esc(st.name)}" data-in="tgn"></div>${st.err?`<span class="err">${st.err}</span>`:''}<div class="acts"><button class="textbtn" data-a="close">Cancel</button><button class="btn sm" data-a="tgsave">${t?'Save':'Add'}</button></div>`,{id,name:t?t.name:'',after},{kind:'dialog'});setTimeout(()=>document.getElementById('tg_n')?.focus(),50)}
A.tgn=el=>{topSheet().st.name=el.value};
A.tgsave=()=>{const st=topSheet().st;const n=st.name.trim();if(!n){st.err='Enter a tag name.';rs();return}if(S.tags.some(t=>t.name.toLowerCase()===n.toLowerCase()&&t.id!==st.id)){st.err='That tag already exists.';rs();return}
  if(st.id){const t=S.tags.find(x=>x.id===st.id);const old=t.name;t.name=n;S.txns.forEach(x=>{if(x.tags)x.tags=x.tags.map(g=>g===old?n:g)})}else S.tags.push({id:uid(),name:n});save();closeSheet();if(st.after)st.after();else render();toast('Tag saved')};
A.tagnew=()=>tagDialog(null);A.tagedit=el=>tagDialog(el.dataset.id);
A.tagdel=el=>{const t=S.tags.find(x=>x.id===el.dataset.id);confirmDel('Delete tag?',`"${esc(t.name)}" will be removed from all transactions.`,()=>{S.tags=S.tags.filter(x=>x.id!==t.id);S.txns.forEach(x=>{if(x.tags)x.tags=x.tags.filter(g=>g!==t.name)});commit('Tag deleted')})};

/* ---------------- Customize dashboard ---------------- */

};
A.reorder_dash=(f,t)=>{moveIdx(U.dash.order,f,t);render()};
A.dwtoggle=el=>{const w=el.dataset.w;U.dash.hidden=el.checked?U.dash.hidden.filter(x=>x!==w):[...U.dash.hidden,w];render()};

/* ---------------- Backup & restore ---------------- */
SCR.backup=()=>({top:hdr(T('Backup & Restore'),{green:true,center:true}),html:`<div class="pad stack" style="align-items:center;text-align:center;padding-top:30px"><div style="width:130px;height:130px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 12%,transparent)"><span class="ic" style="width:90px;height:90px;border-radius:50%;background:var(--accent);color:var(--accent-ink)">${ic('cloud',1.6).replace('<svg','<svg style="width:44px;height:44px"')}</span></div>
  <h2 style="font-size:calc(19px*var(--fs));margin:20px 0 0">Back up your data or restore your latest backup.</h2><p class="small muted">Last Backup: ${S.settings.lastBackup?new Date(S.settings.lastBackup).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'Never'}</p>
  <button class="btn w" data-a="restore">${ic('history')} Restore Data</button><button class="btn out w" data-a="backupnow">${ic('cloud')} Backup Now</button>
  <p class="tiny muted">Backups are saved on this device and as a backup code or file you can keep in Google Drive, email or notes.</p></div>`,fab:false});
const backupJSON=()=>JSON.stringify({app:'salli',v:2,at:new Date().toISOString(),data:{...S,backupSnap:null}});
A.backupnow=()=>{const j=backupJSON();try{localStorage.setItem(KEY+'.backup',j)}catch(e){}S.settings.lastBackup=new Date().toISOString();save();render();
  openSheet(()=>`<h3>Backup created</h3><p class="small muted" style="margin:0">A copy is saved on this device. To keep it safe elsewhere${STANDALONE?', download the file or':''} copy the backup code and store it in Google Drive, email or notes.</p>
   ${STANDALONE?`<button class="btn w" data-a="bkdl">${ic('upload').replace('<svg','<svg style="transform:rotate(180deg)"')} Download backup file</button>`:''}<button class="btn ${STANDALONE?'out':''} w" data-a="bkcopy">${ic('copy')} Copy backup code</button><span class="tiny muted">Size: ${(j.length/1024).toFixed(0)} KB</span>`,{})};
A.bkdl=()=>{downloadFile(`salli-backup-${today()}.json`,backupJSON(),'application/json');toast('Backup file downloaded')};
A.bkcopy=()=>copyText(backupJSON(),'Backup code copied');
A.restore=()=>{let has=false;try{has=!!localStorage.getItem(KEY+'.backup')}catch(e){}
  openSheet(()=>`<div style="text-align:center"><span class="ic lg green" style="margin:0 auto 10px;border-radius:50%;background:var(--accent);color:var(--accent-ink)">${ic('history')}</span><h3>Restore Data</h3><p class="small muted">Choose how to restore</p></div>
   <button class="listbtn" style="border:1px solid var(--accent);background:var(--accent-soft)" data-a="rslast" ${has?'':'disabled'}><span class="ic green">${ic('cloud')}</span><span class="grow"><span class="badge green" style="float:right">Recommended</span><b>Get last backup from this device</b><small>${has?'Quickly restore everything from your latest backup.':'No backup saved on this device yet.'}</small></span>${ic('chevR')}</button>
   <button class="listbtn" data-a="rsmanual"><span class="ic">${ic('link')}</span><span class="grow"><b>Manual restore</b><small>Use a backup file or backup code for more control.</small></span>${ic('chevR')}</button><button class="textbtn" style="color:var(--fg)" data-a="close">Cancel</button>`,{})};
function doRestore(j){try{const o=JSON.parse(j);const d=o.data||o;if(!d.accounts||!d.txns||!d.settings)throw 0;dialog('Replace all data?','Restoring replaces everything currently in the app with the backup.',[{l:'Cancel'},{l:'Restore',red:true,a:()=>{const b=baseState();S=Object.assign(b,d);S.settings=Object.assign(b.settings,d.settings);closeSheet(true);NAV=[{n:'home',p:{}}];commit('Data restored successfully')}}])}catch(e){toast('That isn’t a valid backup. Copy the whole code and try again.',true)}}
A.rslast=()=>{let j=null;try{j=localStorage.getItem(KEY+'.backup')}catch(e){}if(j)doRestore(j)};
A.rsmanual=()=>{closeSheet();openSheet(()=>`<h3>Manual restore</h3><label class="btn out w" style="cursor:pointer">${ic('upload')} Choose backup file<input type="file" accept=".json,application/json,text/plain" hidden data-ch="rsfile"></label><div class="fld"><label for="rscode">Or paste a backup code</label><textarea id="rscode" style="min-height:140px"></textarea></div><button class="btn w" data-a="rscode">Restore</button>`,{})};
A.rsfile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doRestore(r.result);r.readAsText(f)};
A.rscode=()=>doRestore(document.getElementById('rscode').value);

/* ---------------- Settings ---------------- */

  const rowb=(a,i,t,sub,extra='')=>`<button class="setrow" data-a="${a}" ${extra}>${ic(i)}<span class="grow"><b>${t}</b><small>${sub}</small></span>${ic('chevR')}</button>`;
  const rowt=(i,t,sub,id,on,act)=>`<div class="setrow">${ic(i)}<span class="grow"><b>${t}</b><small>${sub}</small></span>${tgl(id,on,act)}</div>`;
  return {top:hdr(T('Settings'),{center:true}),html:`<div class="pad stack"><h2 class="acc sethd">Appearance</h2><div class="card" style="border-top:2px solid var(--accent)"><div class="row b">${ic('palette')} Theme</div>${th('light','Light','sun')}${th('dark','Dark','moon')}${th('system','System default','auto')}</div>
   <h2 class="acc sethd">Accent Color</h2>${accentCard()}
   <h2 class="acc sethd">Typography</h2>${typeCard()}
   <h2 class="acc sethd">Preferences</h2>
   ${rowb('setlang','globe','Choose language',{en:'English',si:'සිංහල',ta:'தமிழ்'}[s.lang])}${rowb('go','money','Currency Settings','Base currency: '+s.base+' — '+(CURM[s.base]?.name||''),'data-n="currency"')}${rowb('go','fx','Exchange Rates','View and manage currency exchange rates','data-n="rates"')}${rowb('go','bell','Notification Settings','Configure app reminders','data-n="notifset"')}
   ${rowt('lock','App Lock','Enable PIN lock','st_lock',!!s.pin,'setlock')}<div class="setrow" style="${s.pin?'':'opacity:.55'}">${ic('key')}<span class="grow"><b>Biometric Unlock</b><small>${s.pin?'Unlock with fingerprint or face. Your PIN still works as a backup.':'Turn on App Lock first. Your PIN is the backup.'}</small></span>${tgl('st_bio',!!s.bio,'setbio',s.pin?'':'disabled')}</div>${rowt('trend','Share usage data','Help improve the app by sharing anonymous usage analytics','st_share',s.share,'setshare')}
   <h2 class="acc sethd">Account</h2>${rowb('profile','user','Profile',s.name||'Using anonymously')}${rowb('go','cloud','Backup & Restore','Keep a copy of your data','data-n="backup"')}
   <button class="setrow" style="border-color:var(--red)" data-a="erase"><span class="red">${ic('erase')}</span><span class="grow"><b class="red">Erase Data</b><small>Delete everything on this device</small></span>${ic('chevR')}</button>
   <p class="tiny muted" style="text-align:center">${APP_NAME} ${APP_VER} · Data stays on this device</p></div>`,fab:false};
};
A.settheme=el=>{S.settings.theme=el.dataset.v;commit()};
A.setshare=el=>{S.settings.share=el.checked;save()};
A.setlang=()=>listPicker('Choose language',[{v:'en',l:'English'},{v:'si',l:'සිංහල',sub:'Sinhala'},{v:'ta',l:'தமிழ்',sub:'Tamil'}],v=>{S.settings.lang=v;commit('Language updated')},{sel:S.settings.lang});
A.setlock=el=>{if(!el.checked){S.settings.pin=null;S.settings.bio=null;commit('App lock off');return}el.checked=false;
  openSheet(st=>`<h3>Set a 4-digit PIN</h3><div class="fld"><label for="pin1">New PIN</label><input id="pin1" type="password" inputmode="numeric" maxlength="4" data-in="pinf" data-k="a"></div><div class="fld"><label for="pin2">Repeat PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="4" data-in="pinf" data-k="b"></div>${st.err?`<span class="err">${st.err}</span>`:''}<div class="btns"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="pinset">Turn on</button></div>`,{a:'',b:''})};
A.pinf=el=>{topSheet().st[el.dataset.k]=el.value};
const pinHash=s=>{let h=5381;for(const c of 'salli:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+(h>>>0).toString(36)};
A.pinset=()=>{const st=topSheet().st;if(!/^\d{4}$/.test(st.a)){st.err='Use exactly 4 digits.';rs();return}if(st.a!==st.b){st.err='The two PINs don’t match.';rs();return}S.settings.pin=pinHash(st.a);closeSheet();commit('App lock on')};
A.erase=()=>openSheet(st=>`<h3 class="red">Erase all data?</h3><p class="small muted" style="margin:0">This deletes every account, transaction, budget, goal and setting on this device. Make a backup first if you might need it.</p><div class="fld"><label for="er_c">Type ERASE to confirm</label><input id="er_c" autocomplete="off" data-in="erf"></div>${st.err?`<span class="err">${st.err}</span>`:''}<div class="btns"><button class="btn out" data-a="close">Cancel</button><button class="btn red" data-a="eraseok">Erase</button></div>`,{v:''});
A.erf=el=>{topSheet().st.v=el.value};
A.eraseok=()=>{const st=topSheet().st;if(st.v.trim().toUpperCase()!=='ERASE'){st.err='Type ERASE to confirm.';rs();return}S=baseState();S.settings.sample=false;S.accounts.push({id:uid(),name:'Cash',currency:'LKR',type:'wallet',include:true,isDefault:true});UNLOCKED=true;closeSheet(true);NAV=[{n:'home',p:{}}];commit('All data erased')};
A.profile=()=>{DRAWER=false;openSheet(st=>`<h3>Profile</h3><p class="small muted" style="margin:0">Optional. ${APP_NAME} works without an account.</p><div class="fld"><label for="pr_n">Name</label><input id="pr_n" value="${esc(st.name)}" data-in="prf" data-k="name"></div><div class="fld"><label for="pr_e">Email</label><input id="pr_e" type="email" value="${esc(st.email)}" data-in="prf" data-k="email"></div><div class="btns"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="prsave">Save</button></div>`,{name:S.settings.name,email:S.settings.email});render()};
A.prf=el=>{topSheet().st[el.dataset.k]=el.value};A.prsave=()=>{const st=topSheet().st;S.settings.name=st.name.trim();S.settings.email=st.email.trim();closeSheet();commit('Profile saved')};

SCR.currency=()=>{const q=(U.curQ||'').toLowerCase();const mine=S.settings.myCurrencies||[];const b=S.settings.base;
  const L=curOrder().filter(c=>!q||c.code.toLowerCase().includes(q)||c.name.toLowerCase().includes(q));
  return {top:hdr('Currency Settings'),html:`<div class="pad stack">
   <button class="setrow" data-a="pickbase">${ic('money')}<span class="grow"><b>Functional currency: ${b} — ${esc(CURM[b]?.name||'')}</b><small>Totals, net worth, reports and budgets are shown in this currency</small></span>${ic('chevR')}</button>
   <div class="between"><span class="sec">My currencies</span><span class="badge green">${mine.length} selected</span></div>
   <span class="tiny muted">Tick every currency you use. They appear first in all currency pickers and in Exchange Rates.</span>
   <div class="chips" style="flex-wrap:wrap">${mine.map(c=>`<span class="chip soft on">${c} <button data-a="mycur" data-c="${c}" aria-label="Remove ${c}" style="margin-left:4px">✕</button></span>`).join('')}</div>
   <label class="search">${ic('search')}<input id="curs" placeholder="Search currency" value="${esc(U.curQ||'')}" data-in="curs"></label>
   <div class="stack s8">${L.map(c=>{const on=mine.includes(c.code);return `<button class="listbtn" data-a="mycur" data-c="${c.code}"><span class="ic green b" style="font-size:calc(13px*var(--fs))">${esc(c.sym)}</span><span class="grow"><b>${c.name}</b><small>${c.code}${c.code===b?' · functional currency':''} · 1 USD = ${rateOf('USD',c.code).toFixed(4)}</small></span><span class="chk ${on?'on':''}">${on?ic('check',3):''}</span></button>`}).join('')}</div></div>`,fab:false}};
A.curs=el=>{U.curQ=el.value;render()};
A.mycur=el=>{const c=el.dataset.c;const m=S.settings.myCurrencies;if(m.includes(c)){if(c===S.settings.base){toast('The functional currency stays in your list',true);return}S.settings.myCurrencies=m.filter(x=>x!==c)}else m.push(c);commit()};
A.pickbase=()=>currencyPicker(S.settings.base,c=>{S.settings.base=c;if(!S.settings.myCurrencies.includes(c))S.settings.myCurrencies.push(c);commit('Currency changed to '+CURM[c].name)},'Functional Currency');
A.setbase=el=>{S.settings.base=el.dataset.c;commit('Currency changed to '+CURM[el.dataset.c].name)};
const REF_FIRST=['USD','MVR','LKR','EUR'];
SCR.rates=()=>{const q=(U.rateQ||'').toUpperCase();const mine=S.settings.myCurrencies||[];
  const pinned=S.rates.filter(r=>!q||r.from.includes(q)||r.to.includes(q));
  const order=[...REF_FIRST,...mine.filter(c=>!REF_FIRST.includes(c)),...CUR.map(c=>c[0]).filter(c=>!REF_FIRST.includes(c)&&!mine.includes(c))];
  const ref=order.map(c=>CURM[c]).filter(c=>c&&(!q||c.code.includes(q)||c.name.toUpperCase().includes(q)));
  const manual=c=>S.rates.some(r=>(r.from==='USD'&&r.to===c)||(r.to==='USD'&&r.from===c));
  const lv=S.live;const st=lv?`Updated from the internet ${lv.date===today()?'today':'on '+fD(lv.date)}${lv.at?' at '+new Date(lv.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}`:'Not downloaded yet — using built-in reference rates';
  return {top:hdr('Exchange Rates',{right:rbtn('rateupdate','refresh','','Update rates now')}),html:`<div class="pad stack"><label class="search">${ic('search')}<input id="rateq" placeholder="Search currency (e.g. USD, LKR)" value="${esc(U.rateQ||'')}" data-in="rateq"></label>
   <div class="card stack s8"><div class="between"><b class="small">My currencies</b><button class="link" data-a="go" data-n="currency">Edit</button></div><div class="chips" style="flex-wrap:wrap">${mine.map(c=>`<span class="chip soft on">1 USD = ${rateOf('USD',c).toFixed(4)} ${c}</span>`).join('')||'<span class="small muted">None selected</span>'}</div></div>
   <span class="tiny green b">Your manual rates (${S.rates.length})</span>${pinned.map(r=>`<div class="row" style="padding:6px 0"><span class="green">${ic('flag')}</span><span class="grow"><b>${r.from} → ${r.to}</b><div class="small muted">Rate: ${(+r.rate).toFixed(4)} • ${r.date}</div></span><button class="ib" data-a="rateedit" data-id="${r.id}" aria-label="Edit">${ic('edit')}</button><button class="ib" data-a="ratedel" data-id="${r.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('')||'<span class="small muted">None yet. Tap + to set the rate your bank uses.</span>'}
   <div class="between" style="margin-top:8px"><span class="tiny muted b">Reference rates · 1 USD =</span><span class="tiny ${lv&&lv.date===today()?'green':'orange'}">${st}</span></div>
   <div class="card">${ref.map(c=>`<div class="kv"><span>${c.code} <span class="tiny muted">${c.name}</span>${mine.includes(c.code)?' <span class="badge green">mine</span>':''}${manual(c.code)?' <span class="badge orange">manual</span>':''}</span><b class="num">${rateOf('USD',c.code).toFixed(4)}</b></div>`).join('')}</div>
   <span class="tiny muted">Rates update automatically once a day when you're online. Manual rates always take priority over downloaded rates.</span></div>`,fab:fabBtn('ratenew',true)}};
A.rateupdate=async()=>{toast('Updating rates…');const r=await refreshLiveRates(true);render();toast(r==='updated'?'Exchange rates updated':'Couldn’t reach the rates service. Using the last saved rates.',r!=='updated')};
A.rateq=el=>{U.rateQ=el.value;render()};
A.ratereset=()=>dialog('Reset manual rates?','All manual rates are removed and built-in reference rates are used.',[{l:'Cancel'},{l:'Reset',red:true,a:()=>{S.rates=[];commit('Rates reset')}}]);
A.ratedel=el=>{S.rates=S.rates.filter(r=>r.id!==el.dataset.id);commit('Rate deleted')};
function rateForm(id){const r=id?S.rates.find(x=>x.id===id):null;const opts=sel=>CUR.map(c=>`<option value="${c[0]}" ${c[0]===sel?'selected':''}>${c[0]} — ${c[1]}</option>`).join('');
  openSheet(st=>`<h3>${r?'Edit':'Add Manual'} Rate</h3><div class="fld"><label for="rf_f">From currency</label><select id="rf_f" data-ch="rff" data-k="from">${opts(st.from)}</select></div><div class="fld"><label for="rf_t">To currency</label><select id="rf_t" data-ch="rff" data-k="to">${opts(st.to)}</select></div><div class="fld"><label for="rf_r">Rate (1 ${st.from} = ? ${st.to})</label><input id="rf_r" inputmode="decimal" value="${esc(st.rate)}" data-in="rff" data-k="rate"></div>${st.err?`<span class="err">${st.err}</span>`:''}<div class="acts"><button class="textbtn" data-a="close">Cancel</button><button class="btn sm" data-a="rfsave">Save</button></div>`,{id,from:r?r.from:'USD',to:r?r.to:S.settings.base,rate:r?String(r.rate):''},{kind:'dialog'})}
A.ratenew=()=>rateForm(null);A.rateedit=el=>rateForm(el.dataset.id);
A.rff=el=>{topSheet().st[el.dataset.k]=el.value;if(el.dataset.k!=='rate')rs()};
A.rfsave=()=>{const st=topSheet().st;const v=parseFloat(st.rate);if(st.from===st.to){st.err='Choose two different currencies.';rs();return}if(!(v>0)){st.err='Enter a rate above zero.';rs();return}
  S.rates=S.rates.filter(x=>x.id!==st.id&&!(x.from===st.from&&x.to===st.to)&&!(x.from===st.to&&x.to===st.from));S.rates.push({id:st.id||uid(),from:st.from,to:st.to,rate:v,date:today(),manual:true});closeSheet();commit('Rate saved')};

/* ---------------- Notifications ---------------- */
function notifications(){const t=today(),out=[],n=S.settings.notif;const soon=(d,k=7)=>d&&diffDays(t,d)<=k;const when=d=>{const k=diffDays(t,d);return k<0?`${-k} days overdue`:k===0?'today':k===1?'tomorrow':`in ${k} days`};
  if(n.subs)S.subs.filter(x=>x.active!==false&&soon(x.next,x.remind?+x.remindDays||3:7)).forEach(x=>out.push({l:x.next<t?'r':'o',i:'sub',t:`${x.name} renews ${when(x.next)}`,s:money(x.amount,x.currency),go:['sub',{id:x.id}]}));
  if(n.budget)S.budgets.forEach(b=>{const p=budgetSpent(b)/b.amount;if(p>=.8)out.push({l:p>=1?'r':'o',i:'budget',t:`${b.name} budget ${p>=1?'exceeded':'at '+Math.round(p*100)+'%'}`,s:`${B(budgetSpent(b))} of ${B(b.amount)}`,go:['budgetView',{id:b.id}]})});
  if(n.inst)S.installments.forEach(x=>{const d=instNext(x);if(d&&soon(d,Math.max(7,x.remindDays)))out.push({l:d<t?'r':'o',i:'inst',t:`${x.title} installment due ${when(d)}`,s:B(x.amount),go:['inst',{id:x.id}]})});
  if(n.bills){S.loans.forEach(l=>{if(loanRemain(l)>0&&+l.months>0){const d=addMonths(l.start,l.payments.length);if(soon(d))out.push({l:d<t?'r':'o',i:'bank',t:`${l.name} instalment due ${when(d)}`,s:money(emiOf(l),lcur(l)),go:['loan',{id:l.id}]})}});
   cards().forEach(c=>{const used=(+c.limit||0)-accBal(c);const d=cardDue(c);if(used>0&&soon(d))out.push({l:'o',i:'card',t:`${c.name} payment due ${when(d)}`,s:money(used,c.currency)+' used',go:['card',{id:c.id}]})});
   S.lendings.forEach(x=>{if(lendRemain(x)>0&&soon(x.due))out.push({l:x.due<t?'r':'o',i:'hand',t:`${x.name} owes you ${money(lendRemain(x),lcur(x))}`,s:'Due '+when(x.due),go:['lending',{id:x.id}]})});
   S.todos.forEach(x=>{if(!x.done&&soon(x.due,2))out.push({l:x.due<t?'r':'o',i:'todo',t:x.title,s:'To-do · '+when(x.due),go:['todos',{}]})});
   S.recurring.forEach(r=>{if(soon(r.next,3))out.push({l:r.next<t?'r':'o',i:'repeat',t:`${r.title||cat(r.catId)?.name} payment due ${when(r.next)}`,s:money(r.amount,accCur(r.accId)),go:['recDetail',{id:r.id}]})})}
  if(S.smsDrafts.length)out.unshift({l:'g',i:'sms',t:`${S.smsDrafts.length} SMS draft${S.smsDrafts.length>1?'s':''} to review`,s:'Tap to review and save',go:['smsDrafts',{}]});
  return out;
}
SCR.notifs=()=>{const L=notifications();return {top:hdr('Notifications',{right:rbtn('go','gear','data-n="notifset"','Notification settings')}),html:`<div class="pad stack">${L.map((x,i)=>`<button class="card click row" data-a="ngo" data-i="${i}"><span class="ic ${x.l==='r'?'red':x.l==='o'?'orange':'green'}">${ic(x.i)}</span><span class="grow"><b>${esc(x.t)}</b><div class="tiny muted">${esc(x.s)}</div></span>${ic('chevR')}</button>`).join('')||emptyState('bell','You’re all caught up','Reminders for bills, budgets, subscriptions and installments appear here')}</div>`,fab:false}};
A.ngo=el=>{const x=notifications()[+el.dataset.i];if(x)go(x.go[0],x.go[1])};
SCR.notifset=()=>{const n=S.settings.notif;const r=(k,t,s)=>`<div class="setrow">${ic('bell')}<span class="grow"><b>${t}</b><small>${s}</small></span>${tgl('ns_'+k,n[k],'nset','data-k="'+k+'"')}</div>`;
  return {top:hdr('Notification Settings'),html:`<div class="pad stack">${r('bills','Bills & due dates','Loan instalments, card payments, money owed and to-dos')}${r('budget','Budget alerts','When a budget reaches 80% and 100%')}${r('subs','Subscription reminders','Before a subscription renews')}${r('inst','Installment reminders','Before each installment is due')}<button class="btn out w" data-a="go" data-n="notifs">${ic('bell')} View notifications</button><p class="tiny muted">Reminders appear in the app's notification list. The Android app build can also show them as phone notifications.</p></div>`,fab:false}};
A.nset=el=>{S.settings.notif[el.dataset.k]=el.checked;save()};

/* ---------------- Lock screen ---------------- */
let PINBUF='';
function renderLock(){app.innerHTML='';layer.innerHTML=`<div class="lock"><span class="ic lg green" style="border-radius:50%">${ic('lock')}</span><h2 style="margin:0">Enter your PIN</h2>${S.settings.bio?'<p class="small muted" style="margin:0">or tap the fingerprint to unlock</p>':''}<div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<PINBUF.length?'f':''}"></i>`).join('')}</div><p class="red small" id="pinerr" style="min-height:1.2em;margin:0"></p><div class="pinkeys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?(S.settings.bio?`<button data-a="biounlock" aria-label="Unlock with fingerprint or face" style="color:var(--accent)">${ic('fingerprint',1.8).replace('<svg width="20" height="20"','<svg width="30" height="30"')}</button>`:'<span></span>'):`<button data-a="pinkey" data-v="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('')}</div><button class="textbtn" data-a="pinforgot">Forgot PIN?</button></div>`}
A.pinkey=el=>{const k=el.dataset.v;if(k==='⌫')PINBUF=PINBUF.slice(0,-1);else if(PINBUF.length<4)PINBUF+=k;renderLock();if(PINBUF.length===4){if(pinHash(PINBUF)===S.settings.pin){unlockApp()}else{PINBUF='';renderLock();document.getElementById('pinerr').textContent='Wrong PIN. Try again.'}}};
A.pinforgot=()=>{layer.innerHTML=`<div class="lock"><h2 style="margin:0">Forgot your PIN?</h2><p class="muted" style="text-align:center;max-width:300px;margin:0">The only way in without the PIN is to erase all data on this device. You can restore from a backup afterwards.</p><div class="btns" style="width:min(320px,100%)"><button class="btn out" data-a="pinback">Go back</button><button class="btn red" data-a="pinwipe">Erase &amp; reset</button></div></div>`};
A.pinback=()=>{PINBUF='';renderLock()};
A.pinwipe=()=>{const bk=(()=>{try{return localStorage.getItem(KEY+'.backup')}catch(e){return null}})();S=baseState();S.accounts.push({id:uid(),name:'Cash',currency:'LKR',type:'wallet',include:true,isDefault:true});UNLOCKED=true;layer.innerHTML='';commit('Data erased. Restore a backup from Backup & Restore.')};

/* ---------------- Biometric unlock ----------------
   Android app: the phone's fingerprint / face unlock through the NativeBiometric plugin.
   Browser (served over https): the device's built-in authenticator through WebAuthn. */
function unlockApp(){UNLOCKED=true;PINBUF='';layer.innerHTML='';render();newMonthCheck()}
const BIO_NATIVE=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.NativeBiometric;
async function bioAvailable(){
  const N=BIO_NATIVE();if(N){try{const r=await N.isAvailable();return r&&r.isAvailable?'native':null}catch(e){return null}}
  try{if(window.PublicKeyCredential&&window.isSecureContext&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())return 'web'}catch(e){}
  return null}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioVerify(mode,credId){
  if(mode==='native'){const N=BIO_NATIVE();await N.verifyIdentity({reason:'Unlock '+APP_NAME,title:'Unlock '+APP_NAME,subtitle:'Use your fingerprint or face',negativeButtonText:'Use PIN',maxAttempts:5});return true}
  const c=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(credId)}],userVerification:'required',timeout:60000}});return !!c}
async function bioEnroll(mode){
  if(mode==='native'){await bioVerify('native');return {mode}}
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:APP_NAME},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'salli-user',displayName:S.settings.name||APP_NAME+' user'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
  return {mode,credId:b64(c.rawId)}}
A.setbio=async el=>{
  if(!el.checked){S.settings.bio=null;commit('Biometric unlock off');return}
  el.checked=false;if(!S.settings.pin){toast('Turn on App Lock with a PIN first',true);return}
  const mode=await bioAvailable();
  if(!mode){dialog('Biometric unlock unavailable','This device has no fingerprint or face unlock set up, or this view doesn’t allow it. Install the Android app (or open the app over https) and make sure a fingerprint or face is enrolled in your phone’s settings.',[{l:'OK',primary:true}]);return}
  try{S.settings.bio=await bioEnroll(mode);commit('Biometric unlock on')}catch(e){toast('Biometric check was cancelled. Biometric unlock is still off.',true)}};
A.biounlock=async()=>{const b=S.settings.bio;if(!b)return;try{await bioVerify(b.mode,b.credId);unlockApp()}catch(e){const m=document.getElementById('pinerr');if(m)m.textContent='Not recognised. Try again or enter your PIN.'}};

const PAL=['#7C6CF2','#2FBF85','#F2B53B','#EF6B5B','#3D8BF2','#E35FA6','#25C2C2','#A89BF7','#F59E7C','#5FD3A6','#B58CF0','#9CA3AF'];
function donutSVG(items,total,label,o={}){const sz=o.size||170,R=sz*0.36,sw=sz*0.2,C=2*Math.PI*R;let off=0;
  const segs=items.map(it=>{const len=total?it.v/total*C:0;const s=`<circle r="${R}" cx="${sz/2}" cy="${sz/2}" fill="none" stroke="${it.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0,len-(items.length>1?1.5:0))} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`;off+=len;return s}).join('');
  const lab=o.pct?items.map((it,i)=>{const prev=sum(items.slice(0,i),x=>x.v);const a=((prev+it.v/2)/total)*2*Math.PI-Math.PI/2;return it.v/total>.06?`<text x="${sz/2+Math.cos(a)*R}" y="${sz/2+Math.sin(a)*R+3}" text-anchor="middle" style="font-size:${sz/20}px;font-weight:700;fill:#fff">${Math.round(it.v/total*100)}%</text>`:''}).join(''):'';
  return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" style="max-width:100%" class="chart" role="img" aria-label="Breakdown chart"><circle r="${R}" cx="${sz/2}" cy="${sz/2}" fill="none" stroke="var(--card2)" stroke-width="${sw}"/>${segs}${lab}${label?`<text x="${sz/2}" y="${sz/2-4}" text-anchor="middle" style="font-size:${sz/18}px">Total</text><text x="${sz/2}" y="${sz/2+sz/14}" text-anchor="middle" style="font-size:${sz/13}px;font-weight:700;fill:var(--fg)">${label}</text>`:''}</svg>`;
}
function bars2(days,a,b,labels,o={}){const W=320,H=o.h||140,pl=30,pb=16,pt=6;const max=Math.max(1,...a,...b);const n=days.length,gw=(W-pl)/n;const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';for(let i=0;i<=2;i++){const v=max*i/2;g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${compact(v)}</text>`}
  const bw=Math.max(1.5,Math.min(8,gw/2-1));let r='';days.forEach((d,i)=>{const x=pl+i*gw+gw/2;if(a[i])r+=`<rect x="${x-bw}" y="${y(a[i])}" width="${bw}" height="${H-pb-y(a[i])}" rx="1.5" fill="var(--red)"/>`;if(b[i])r+=`<rect x="${x}" y="${y(b[i])}" width="${bw}" height="${H-pb-y(b[i])}" rx="1.5" fill="var(--pos)"/>`;if(labels[i])r+=`<text x="${x}" y="${H-3}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="chart" role="img" aria-label="${o.label||'Daily income and expense'}">${g}${r}</svg>`;
}

function healthScore(f,t){const st=stats(f,t);const len=diffDays(f,t)+1;const pf=addDays(f,-len),pt=addDays(f,-1);const ps=stats(pf,pt);
  const sr=st.inc?(st.inc-st.exp)/st.inc:(st.exp?-1:0);
  const p1=clamp(Math.round(sr/0.2*25),0,25);
  let p2,n2;if(!S.budgets.length){p2=15;n2='No budgets set'}else{const ok=S.budgets.filter(b=>budgetSpent(b)<=b.amount).length;p2=Math.round(ok/S.budgets.length*25);n2=`${ok} of ${S.budgets.length} budgets on track`}
  let p3,n3;if(!ps.exp){p3=12;n3='No prior period data'}else{const ch=(st.exp-ps.exp)/ps.exp;p3=ch<=0?20:ch<=.1?14:6;n3=ch<=0?'Spending down '+Math.round(-ch*100)+'%':'Spending up '+Math.round(ch*100)+'%'}
  const ratio=st.exp?st.inc/st.exp:(st.inc?9:1);const p4=ratio>=1.5?20:ratio>=1.2?16:ratio>=1?12:ratio>=.8?6:2;const n4=ratio>=1.2?'Healthy income cushion':ratio>=.8?'Income near expenses':'Expenses exceed income';
  const debtPay=sum(st.list.filter(x=>['loan_pay','inst'].includes(x.kind)),tBase);const dl=st.inc?debtPay/st.inc:(debtPay?1:0);const p5=dl===0?10:dl<.2?8:dl<.4?5:2;const n5=dl===0?'No outstanding debt payments':Math.round(dl*100)+'% of income to debt';
  const score=p1+p2+p3+p4+p5;const g=score>=85?['A','Excellent']:score>=70?['B','Good']:score>=55?['C','Average']:score>=40?['D','Fair']:['F','Poor'];
  return {score,g,parts:[['Savings Rate',p1,25,sr<0?'Negative savings':Math.round(sr*100)+'% saved'],['Budget Adherence',p2,25,n2],['Spending Trend',p3,20,n3],['Income-Expense Ratio',p4,20,n4],['Debt Load',p5,10,n5]],sr,st,ps};
}

  const r={id:e.id||uid(),name:e.name.trim(),desc:e.desc.trim(),start:e.start,end:e.end||'',limit:parseFloat(e.limit)||0,planned:e.planned,created:e.created||today()};
  if(e.id)Object.assign(S.splans.find(p=>p.id===e.id),r);else S.splans.push(r);U.sp=null;back();if(!e.id)go('splan',{id:r.id});commit(e.id?'Spending plan updated':'Spending plan created')};
SCR.splan=P=>{const p=S.splans.find(x=>x.id===P.id);if(!p)return SCR.splans();const s=splanStats(p);const f=U.spf=U.spf&&U.spf.id===p.id?U.spf:{id:p.id,sort:'date',show:'all',cat:''};
  const byCat=p.planned.reduce((m,x)=>{(m[x.catId]=m[x.catId]||{plan:0}).plan+=x.amount;return m},{});
  Object.keys(byCat).forEach(id=>byCat[id].act=sum(s.tx.filter(t=>catAndSubs(id).includes(t.catId)),tBase));
  let rows=[...s.tx.map(t=>({k:'a',t,d:t.date+(t.time||''),catId:t.catId,v:tBase(t)})),...p.planned.map(x=>({k:'p',x,d:'',catId:x.catId,v:x.amount}))];
  if(f.show==='planned')rows=rows.filter(r=>r.k==='p');if(f.show==='actual')rows=rows.filter(r=>r.k==='a');if(f.cat)rows=rows.filter(r=>catAndSubs(f.cat).includes(r.catId));
  rows.sort(f.sort==='amount'?(a,b)=>b.v-a.v:f.sort==='category'?(a,b)=>(cat(a.catId)?.name||'').localeCompare(cat(b.catId)?.name||''):(a,b)=>(a.k===b.k?b.d.localeCompare(a.d):a.k==='a'?-1:1));
  const tile=(i,c,k,v,vc)=>`<div class="card"><span class="ic ${c}" style="width:30px;height:30px">${ic(i)}</span><div class="tiny muted" style="margin-top:8px">${k}</div><b class="num ${vc}">${B(v)}</b></div>`;
  const cats=[...new Set([...p.planned.map(x=>x.catId),...s.tx.map(t=>t.catId)])].filter(id=>cat(id));
  return {top:hdr(esc(p.name),{sub:B(s.cap),right:rbtn('refresh','refresh','','Refresh')+rbtn('spedit','edit',`data-id="${p.id}"`,'Edit')+rbtn('spdel','trash',`data-id="${p.id}"`,'Delete')}),
   html:`<div class="pad stack"><div style="text-align:center;padding:6px 0"><div class="small muted">Remaining Balance</div><div class="big num ${s.rem<0?'red':'green'}" style="font-size:calc(30px*var(--fs))">${B(s.rem)}</div></div>
   <div class="g2">${tile('bank','green','Budget Limit',s.limit,'green')}${tile('repeat','blue','Total Planned',s.planned,'blue')}${tile('warn','orange','Total Unplanned',s.unplanned,'orange')}${tile('receipt','green','Total Spent',s.spent,'green')}</div>
   <div class="card row"><span class="grow"><span class="badge ${s.mood[1]}">${s.mood[0]}</span><div class="small" style="margin-top:8px">${s.mood[2]}</div><b class="num ${s.rem<0?'red':'green'}">${B(s.rem)}</b>${prog(Math.min(1,s.cap?Math.max(0,s.rem)/s.cap:0))}</span><span style="font-size:calc(48px*var(--fs));line-height:1" aria-hidden="true">${s.mood[3]}</span></div>
   ${Object.keys(byCat).length?`<div class="card stack s8"><b>By category</b>${Object.entries(byCat).map(([id,o])=>{const q=o.plan?o.act/o.plan:0;return `<button class="stack" style="gap:4px;text-align:left;width:100%" data-a="spcat" data-c="${id}"><div class="between small"><span class="row"><span>${cat(id)?.icon||''}</span><span><b>${esc(cat(id)?.name||'Category')}</b><div class="tiny muted num">${B(o.plan)}</div></span></span><span class="row tiny num muted">${B(o.act)} / ${B(o.plan)} ${ic('chevR').replace('<svg width="20" height="20"','<svg width="14" height="14"')}</span></div>${prog(q,q>1?'r':'')}</button>`}).join('')}</div>`:''}
   <div class="card">${[['Start Date',fD(p.start)],['End Date',p.end?fD(p.end):'Not set'],['Description',p.desc||'—']].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div>
   <div class="between"><span class="sec" style="font-size:calc(15px*var(--fs))">Transactions</span><span class="small muted">${rows.length} items</span></div>
   <div class="chips"><button class="chip on" data-a="spsort">Sort: ${{date:'Date',category:'Category',amount:'Amount (highest first)'}[f.sort]}</button><button class="chip on" data-a="spshow">${{all:'All',planned:'Planned',actual:'Actual'}[f.show]}</button><button class="chip ${f.cat?'on':''}" data-a="spcatf">${f.cat?esc(cat(f.cat)?.name||'Category'):'Category'}</button></div>
   ${rows.map(r=>r.k==='a'?`<button class="card click row" data-a="txopen" data-id="${r.t.id}"><span class="ic green">${ic('receipt')}</span><span class="grow"><b>${esc(cat(r.catId)?.name||txTitle(r.t))}</b><div class="tiny muted">${fD(r.t.date)}${r.t.note?' · '+esc(r.t.note):''}</div></span><span style="text-align:right"><b class="red num">${B(r.v)}</b><div class="tiny muted">${ic('eye').replace('<svg width="20" height="20"','<svg width="12" height="12"')} View Details</div></span></button>`
     :`<div class="card row"><span class="ic blue">${ic('repeat')}</span><span class="grow"><b>${esc(cat(r.catId)?.name||'Category')}</b><div class="tiny muted">Planned · ${esc(r.x.note||'—')}</div></span><span style="text-align:right"><b class="blue num">${B(r.v)}</b><div class="tiny muted">Planned</div></span><button class="ib red" data-a="spdelplan" data-id="${p.id}" data-x="${r.x.id}" aria-label="Delete planned expense">${ic('trash')}</button></div>`).join('')||'<div class="card small muted">No transactions match these filters.</div>'}
   <div style="height:60px"></div></div>`,
   fab:`<button class="btn" style="position:fixed;z-index:26;right:max(16px,calc(50% - 264px));bottom:calc(22px + env(safe-area-inset-bottom,0px));border-radius:16px;box-shadow:var(--shadow)" data-a="spadd" data-id="${p.id}">${ic('plus',2)} Add Transaction</button>`};
};
A.spedit=el=>spEdit(el.dataset.id);A.spdel=el=>spDelete(el.dataset.id);
A.spsort=el=>openMenu(el,[['date','Date'],['category','Category'],['amount','Amount (highest first)']].map(([v,l])=>({l,a:()=>{U.spf.sort=v;render()}})));
A.spshow=el=>openMenu(el,[['all','All'],['planned','Planned'],['actual','Actual']].map(([v,l])=>({l,a:()=>{U.spf.show=v;render()}})));
A.spcatf=el=>{const p=S.splans.find(x=>x.id===U.spf.id);const ids=[...new Set([...p.planned.map(x=>x.catId),...splanTxns(p).map(t=>t.catId)])].filter(id=>cat(id));openMenu(el,[{l:'All categories',a:()=>{U.spf.cat='';render()}},...ids.map(id=>({l:cat(id).name,a:()=>{U.spf.cat=id;render()}}))])};
A.spcat=el=>{U.spf.cat=el.dataset.c;render();setTimeout(()=>document.querySelector('[data-a=spsort]')?.scrollIntoView({behavior:'smooth',block:'start'}),30)};
A.spdelplan=el=>{const p=S.splans.find(x=>x.id===el.dataset.id);p.planned=p.planned.filter(x=>x.id!==el.dataset.x);commit('Planned expense removed')};
A.spadd=el=>{const id=el.dataset.id;openMenu(el,[{l:'Add Transaction',i:'receipt',a:()=>{if(!S.accounts.length){toast('Create an account first',true);return}const p=S.splans.find(x=>x.id===id);const d=p.start<=today()&&(!p.end||p.end>=today())?today():p.start;
   catPicker('expense',catId=>calcSheet({type:'expense',catId,accId:defaultAcc(),expr:'',date:d,time:nowTime(),tags:[],note:'',receipt:null,planId:id}))}},
  {l:'Add Planned Expense',i:'repeat',a:()=>plannedSheet(x=>{S.splans.find(p=>p.id===id).planned.push(x);commit('Planned expense added')})}])};

/* ---------------- New month welcome ---------------- */
function newMonthCheck(){const k=ym(today());if(!S.settings.lastMonthSeen){S.settings.lastMonthSeen=k;save();return}
  if(S.settings.lastMonthSeen>=k)return;
  const pk=ym(addMonths(k+'-01',-1));const st=stats(monthStart(pk),monthEnd(pk));const net=st.inc-st.exp;
  openSheet(()=>`<div style="text-align:center"><span class="ic lg" style="margin:6px auto 12px;width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 15%,transparent)">${ic('sparkle').replace('<svg width="20" height="20"','<svg width="34" height="34"')}</span>
   <div class="tiny green b" style="letter-spacing:.12em">NEW MONTH PERIOD</div><h3 style="font-size:calc(21px*var(--fs));margin-top:6px">Welcome to Your New Month!</h3><span class="badge" style="margin-top:8px;padding:6px 12px">${fD(monthStart(k)).replace(/, \d{4}$/,'')} → ${fD(monthEnd(k)).replace(/, \d{4}$/,'')}</span></div>
   <div class="row small"><span class="ic green" style="width:30px;height:30px;border-radius:50%">${ic('refresh')}</span>Financial summary reset for a clean view</div>
   <div class="row small"><span class="ic green" style="width:30px;height:30px;border-radius:50%">${ic('lock')}</span>All historical data is safely preserved</div>
   <div class="card stack s8"><div class="row"><span class="ic green">${ic('trend')}</span><span><b>Last Month Summary</b><div class="tiny muted">${fD(monthStart(pk)).replace(/, \d{4}$/,'')} - ${fD(monthEnd(pk)).replace(/, \d{4}$/,'')}</div></span></div>
   <div class="between small"><span class="row"><span class="ic green" style="width:28px;height:28px">${ic('trend')}</span>Income</span><b class="green num">${B(st.inc)}</b></div>
   <div class="between small"><span class="row"><span class="ic red" style="width:28px;height:28px">${ic('arrUR')}</span>Expenses</span><b class="red num">${B(st.exp)}</b></div>
   <div class="between small"><span class="row"><span class="ic ${net<0?'red':'green'}" style="width:28px;height:28px">${ic(net<0?'warn':'goal')}</span><span>Net Savings<div class="tiny muted">${st.inc?(net/st.inc*100).toFixed(1)+'% of income':'No income recorded'}</div></span></span><b class="num ${net<0?'red':'green'}">${B(net)}</b></div></div>
   <button class="btn w" data-a="newmonthok">Start New Month ${ic('back',2).replace('<svg','<svg style="transform:rotate(180deg)"')}</button>`,{},{onClose:()=>{S.settings.lastMonthSeen=k;save()}});
}
A.newmonthok=()=>closeSheet();

   Boot
   ================================================================= */
SCR.newBudgetAlias=SCR.newBudget;
const posted=runFDInterest();
// auto-renew subscriptions that passed without payment stay overdue (shown in list); nothing to post automatically
window.addEventListener('popstate',()=>{});
render();
if(posted&&UNLOCKED)toast(posted+' FD interest payment'+(posted>1?'s':'')+' added');
if(UNLOCKED)newMonthCheck();
else if(S.settings.bio&&S.settings.bio.mode==='native')setTimeout(()=>A.biounlock(),300); // prompt for fingerprint straight away in the Android app
refreshLiveRates().then(r=>{if(r==='updated'&&UNLOCKED)render()});

// Android hardware back button (Capacitor native build)
try{const AppP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(AppP)AppP.addListener('backButton',()=>{if(MENU){MENU=null;renderLayer();return}if(SH.length||DRAWER||NAV.length>1){back();return}
    if(!TABS.includes(cur().n)||cur().n!=='home'){tab('home');return}
    dialog('Exit App','Do you really want to exit the app?',[{l:'Cancel'},{l:'Exit',primary:true,a:()=>AppP.exitApp()}])})}catch(e){}
