<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Salli Money Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#12161B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Lora:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>
/* Layout: phone app shell — sticky top bar, scrolling screen, fixed bottom tabs with floating + button, stacked bottom sheets and centred dialogs. Dark-first like the recorded app. */
:root{
  --fs:1;
  --bg:#12161B; --card:#1D232A; --card2:#252C34; --line:#2F3740; --field:#171C21;
  --fg:#E9EDF0; --muted:#8B96A2; --faint:#5D6873;
  --accent:#4CC38A; --accent-ink:#0B2318; --accent-soft:#1C3A2C; --accent-strong:#3FB27B;
  --red:#E5574F; --red-soft:#3A2023; --orange:#F2A93B; --orange-soft:#3A2E1A;
  --blue:#4A7BF7; --blue-soft:#1C2A48; --purple:#8B6CF0; --purple-soft:#2A2448;
  --hdr-green:#3E9E70; --hdr-green2:#2C7552;
  --shadow:0 8px 28px rgba(0,0,0,.35);--tx-hero:#163A2B;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5F6; --card:#FFFFFF; --card2:#EEF1F3; --line:#DDE3E7; --field:#F7F9FA;
  --fg:#16202A; --muted:#5F6B76; --faint:#9AA5AF;
  --accent:#2FAE72; --accent-ink:#FFFFFF; --accent-soft:#DDF3E8; --accent-strong:#26985F;
  --red:#D93F38; --red-soft:#FBE3E1; --orange:#C9830F; --orange-soft:#FBEED6;
  --blue:#2F62E0; --blue-soft:#E1E9FC; --purple:#6B4FD8; --purple-soft:#ECE7FC;
  --hdr-green:#3FB27B; --hdr-green2:#2E9663;
  --shadow:0 8px 24px rgba(20,30,40,.12);--tx-hero:#D7F0E3;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5F6; --card:#FFFFFF; --card2:#EEF1F3; --line:#DDE3E7; --field:#F7F9FA;
  --fg:#16202A; --muted:#5F6B76; --faint:#9AA5AF;
  --accent:#2FAE72; --accent-ink:#FFFFFF; --accent-soft:#DDF3E8; --accent-strong:#26985F;
  --red:#D93F38; --red-soft:#FBE3E1; --orange:#C9830F; --orange-soft:#FBEED6;
  --blue:#2F62E0; --blue-soft:#E1E9FC; --purple:#6B4FD8; --purple-soft:#ECE7FC;
  --hdr-green:#3FB27B; --hdr-green2:#2E9663;
  --shadow:0 8px 24px rgba(20,30,40,.12);--tx-hero:#D7F0E3;
  color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:calc(14px*var(--fs));line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.screen{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s8{gap:8px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;min-height:58px;padding-block:6px}
.top h1{margin:0;font-size:calc(17px*var(--fs));font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1.c{text-align:center}
.top .sub{font-size:calc(11.5px*var(--fs));color:var(--muted);font-weight:400}
.top.green{background:var(--hdr-green);color:#fff}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative;color:inherit}
.ib:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.ib svg{width:22px;height:22px}
.ib.circle{border-radius:50%;background:var(--card2)}
.avatar{width:40px;height:40px;border-radius:50%;background:#B8C2CC;color:#24303B;display:grid;place-items:center;font-weight:600;font-size:calc(18px*var(--fs));flex:none}
.hi b{font-size:calc(16px*var(--fs));display:block}.hi span{font-size:calc(11.5px*var(--fs));color:var(--muted)}
/* green hero headers */
.ghero{background:linear-gradient(160deg,var(--hdr-green),var(--hdr-green2));color:#fff;padding-block:4px 18px;position:relative;overflow:hidden}
.ghero::after{content:"";position:absolute;pointer-events:none;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.ghero .lbl{font-size:calc(13px*var(--fs));opacity:.85}
.ghero .big{font-size:calc(32px*var(--fs));font-weight:800;letter-spacing:-.01em}
.ghero .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pillbox{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--fs))}
.pillbox b{display:block;font-size:calc(13px*var(--fs))}
.pillbox small{opacity:.8;font-size:calc(10px*var(--fs));display:block}
.amtbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:24px}
.amtbar .k{font-size:calc(14px*var(--fs))}.amtbar .k small{display:block;opacity:.75;font-size:calc(11px*var(--fs))}
.amtbar .v{font-size:calc(30px*var(--fs));font-weight:800;text-align:right;overflow-wrap:anywhere}
/* cards */
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.card.tight{padding:10px 12px}
.card.click{cursor:pointer;text-align:left;width:100%;display:block}
.card.glow{position:relative;overflow:hidden}
.card.glow::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);pointer-events:none}
.card.topline{border-top:2px solid var(--accent)}
.k{font-size:calc(12px*var(--fs));color:var(--muted)}
.v{font-weight:700}
.big{font-size:calc(26px*var(--fs));font-weight:800;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.green{color:var(--accent)}.red{color:var(--red)}.orange{color:var(--orange)}.blue{color:var(--blue)}
.small{font-size:calc(12px*var(--fs))}.tiny{font-size:calc(10.5px*var(--fs))}
.b{font-weight:700}
.sec{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(13px*var(--fs));margin:4px 0 0}
.sec::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent)}
.sec.cap{font-size:calc(11px*var(--fs));letter-spacing:.08em;text-transform:uppercase}
.h2{font-size:calc(16px*var(--fs));font-weight:700;margin:0}
.link{color:var(--accent);font-weight:600;font-size:calc(12.5px*var(--fs))}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--card2);font-size:calc(20px*var(--fs))}
.ic svg{width:20px;height:20px}
.ic.lg{width:46px;height:46px;font-size:calc(24px*var(--fs));border-radius:14px}
.ic.green{background:var(--accent-soft);color:var(--accent)}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.orange{background:var(--orange-soft);color:var(--orange)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.ic.purple{background:var(--purple-soft);color:var(--purple)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:calc(10.5px*var(--fs));font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.green{background:var(--accent-soft);color:var(--accent)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.daychip{display:inline-flex;align-items:center;gap:6px}
.daychip i{font-style:normal;font-size:calc(10.5px*var(--fs));padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
/* transactions */
.txlist{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.tx .ic{width:42px;height:42px}
.tx .t{font-weight:600;font-size:calc(13.5px*var(--fs))}
.tx .s{font-size:calc(11px*var(--fs));color:var(--muted)}
.tx .n{font-size:calc(11px*var(--fs));color:var(--muted);font-style:italic}
.tx .a{text-align:right;font-weight:700;font-size:calc(13.5px*var(--fs));white-space:nowrap}
.tx .a small{display:block;font-weight:500;font-size:calc(10.5px*var(--fs));opacity:.75}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px 8px;font-size:calc(13px*var(--fs))}
.dayhead .tt{font-size:calc(11.5px*var(--fs));font-weight:600;display:flex;gap:10px}
/* chips / tabs */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:calc(12.5px*var(--fs));color:var(--muted);background:transparent;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.soft.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mchip{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid var(--accent-soft);display:grid;place-items:center;font-size:calc(12px*var(--fs));font-weight:600;color:var(--muted)}
.mchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px 4px 10px;font-weight:600;font-size:calc(12.5px*var(--fs));color:var(--muted);border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button svg{width:22px;height:22px}
.tabs.left button{flex:none;padding-inline:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px;border-radius:9px;font-weight:600;font-size:calc(13px*var(--fs));color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:calc(14px*var(--fs))}
.btn svg{width:18px;height:18px}
.btn.out{background:transparent;border:1.5px solid var(--accent);color:var(--fg)}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:calc(12.5px*var(--fs));border-radius:10px}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.textbtn{color:var(--accent);font-weight:600;padding:8px}
.textbtn.red{color:var(--red)}
/* fields */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.flabel{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:500}
.inp,.fld input,.fld select,.fld textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:calc(14px*var(--fs))}
.fld textarea{min-height:84px;resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none}
.iconfield{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;min-height:62px;width:100%;text-align:left;border:1px solid transparent}
.iconfield .ic{background:var(--accent-soft);color:var(--accent)}
.iconfield .grow small{display:block;font-size:calc(11px*var(--fs));color:var(--muted)}
.iconfield input,.iconfield select{border:0;background:transparent;padding:2px 0;width:100%;font-size:calc(15px*var(--fs));font-weight:600}
.iconfield input:focus,.iconfield select:focus{outline:none}
.iconfield:focus-within{border-color:var(--accent)}
.err{color:var(--red);font-size:calc(11.5px*var(--fs))}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;border:1px solid var(--line)}
.search input{flex:1;border:0;background:transparent;padding:13px 0;font-size:calc(14px*var(--fs))}
.search input:focus{outline:none}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--card2);border:1px solid var(--line);transition:.15s}
.toggle span::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--muted);top:3px;left:3px;transition:.15s}
.toggle input:checked+span{background:var(--accent-strong);border-color:var(--accent-strong)}
.toggle input:checked+span::after{left:24px;background:#fff}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}
/* account chips */
.accchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.accchip{flex:none;min-width:92px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1.5px solid transparent;text-align:left}
.accchip b{display:block;font-size:calc(12.5px*var(--fs));white-space:nowrap}
.accchip small{font-size:calc(11px*var(--fs));color:var(--muted);white-space:nowrap}
.accchip.on{border-color:var(--accent);background:var(--accent-soft)}
.accchip.on b{color:var(--accent)}
.walletcard{flex:none;width:150px;border-radius:16px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.walletcard .ic{width:34px;height:34px}
/* category picker */
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.catb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:calc(11.5px*var(--fs));font-weight:600;text-align:center;min-width:0}
.catb .em{width:58px;height:58px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:calc(30px*var(--fs))}
.catb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.catsq{flex:none;width:66px;height:72px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:calc(10px*var(--fs));font-weight:600;border:1.5px solid transparent}
.catsq .e{font-size:calc(28px*var(--fs));line-height:1}
.catsq.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.catsq span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:260px;overflow:auto;padding:8px;background:var(--field);border-radius:12px}
.icongrid button{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--card2);font-size:calc(24px*var(--fs));display:grid;place-items:center;border:2px solid transparent}
.icongrid button.on{border-color:var(--accent)}
/* keypad */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kp button{height:58px;border-radius:14px;background:var(--card2);font-size:calc(21px*var(--fs));font-weight:600}
.kp .op{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent)}
.kp .c{background:var(--red-soft);color:var(--red)}
.kp .eq{grid-column:span 3;background:var(--accent);color:var(--accent-ink)}
.kpd{background:var(--card2);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.kpd .val{font-size:calc(30px*var(--fs));font-weight:700;text-align:right;overflow-wrap:anywhere}
.kpd .val small{font-size:calc(15px*var(--fs));color:var(--muted);font-weight:500;margin-right:4px}
.kpd .expr{text-align:right;font-size:calc(12px*var(--fs));color:var(--muted);min-height:16px}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:calc(11px*var(--fs));font-weight:600;color:var(--muted)}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--accent)}
.fab{position:fixed;z-index:26;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab svg{width:28px;height:28px}
.fab.low{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.bottombar>div{max-width:560px;margin:0 auto}
/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet.full{height:92%}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:calc(18px*var(--fs));font-weight:700}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.dlgwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.dlg{background:var(--card);border-radius:22px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dlg h3{margin:0;font-size:calc(19px*var(--fs));font-weight:600}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--accent);color:var(--accent-ink);padding:14px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));font-size:calc(13px*var(--fs));font-weight:500}
.toast.err{background:var(--red);color:#fff}
/* drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,330px);background:var(--bg);z-index:51;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:slide .2s ease-out;border-radius:0 20px 20px 0}
@keyframes slide{from{transform:translateX(-30px);opacity:.5}}
.dhead{background:linear-gradient(160deg,var(--hdr-green),var(--hdr-green2));color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 18px max(18px,env(safe-area-inset-left,0px));position:relative;border-radius:0 20px 0 0}
.dhead .brand{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));font-size:calc(9px*var(--fs));letter-spacing:.2em;opacity:.6;font-weight:700}
.dhead .avatar{width:48px;height:48px;margin-bottom:10px}
.dhead small{opacity:.8;font-size:calc(10.5px*var(--fs))}
.dsec{font-size:calc(10.5px*var(--fs));letter-spacing:.12em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;padding:16px 18px 6px max(18px,env(safe-area-inset-left,0px))}
.dsec::before{content:"";width:2px;height:12px;background:var(--accent)}
.dsec.o::before{background:var(--orange)}.dsec.r::before{background:var(--red)}.dsec.b::before{background:var(--blue)}.dsec.p::before{background:var(--purple)}
.ditem{display:flex;align-items:center;gap:14px;padding:7px 18px 7px max(18px,env(safe-area-inset-left,0px));width:100%;text-align:left;font-size:calc(13.5px*var(--fs))}
.ditem:hover{background:var(--card)}
.ditem .ic{width:36px;height:36px}
.smscard{margin:14px 14px 0;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 25%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--purple) 45%,transparent);width:calc(100% - 28px);text-align:left}
.smscard small{display:block;font-size:calc(10.5px*var(--fs));color:var(--muted)}
/* misc */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:56px 20px}
.empty svg{width:56px;height:56px;color:var(--faint)}
.empty b{color:var(--fg);font-size:calc(15px*var(--fs))}
.prog{height:6px;border-radius:4px;background:var(--card2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.prog.o i{background:var(--orange)}.prog.r i{background:var(--red)}.prog.b i{background:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:calc(13px*var(--fs));border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.listbtn{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:14px;width:100%;text-align:left}
.listbtn .grow small{display:block;color:var(--muted);font-size:calc(11.5px*var(--fs))}
.setrow{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:14px;border-top:2px solid var(--accent);width:100%;text-align:left}
.setrow svg{width:22px;height:22px;color:var(--accent);flex:none}
.setrow small{display:block;color:var(--muted);font-size:calc(11.5px*var(--fs))}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.menu{position:fixed;z-index:80;background:var(--card);border-radius:12px;box-shadow:var(--shadow);min-width:180px;padding:6px;border:1px solid var(--line)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:8px;text-align:left;font-size:calc(13.5px*var(--fs))}
.menu button:hover{background:var(--card2)}
.menu button svg{width:18px;height:18px}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(11px*var(--fs));color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel>*{scroll-snap-align:start;flex:none;width:calc(50% - 5px)}
.drag{color:var(--faint)}
.dashed{border:1.5px dashed var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:calc(12.5px*var(--fs))}
.timeline{display:flex;flex-direction:column;gap:12px;position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.timeline .tl{position:relative}
.timeline .tl::before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.receipt{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--card2)}
/* report pages */
.rep-wrap{background:#D9DDE0;padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.page{background:#fff;color:#1A2027;border-radius:2px;min-height:420px;display:flex;flex-direction:column;font-size:calc(11px*var(--fs));box-shadow:0 2px 8px rgba(0,0,0,.15)}
.page .ph{background:#0E2A1F;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:calc(9px*var(--fs))}
.page .ph b{font-size:calc(12px*var(--fs))}
.page .pb{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.page .pf{padding:8px 14px;font-size:calc(8px*var(--fs));color:#99A3AB;display:flex;justify-content:space-between}
.page table{width:100%;border-collapse:collapse;font-size:calc(10px*var(--fs))}
.page th{background:#0E2A1F;color:#fff;text-align:left;padding:4px 6px;font-weight:600}
.page td{padding:4px 6px;border-bottom:1px solid #EEF0F2;color:#1A2027;font-size:calc(10px*var(--fs))}
.page td.r,.page th.r{text-align:right}
.page .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.page .mc{border:1px solid #E5484D;border-radius:4px;padding:6px;font-size:calc(8.5px*var(--fs));color:#6A747D}
.page .mc.g{border-color:#2FAE72}
.page .mc b{display:block;font-size:calc(11px*var(--fs));color:#1A2027}
.page .mc b.gr{color:#1E8E5A}.page .mc b.rd{color:#D93F38}
.page h4{margin:0;font-size:calc(11.5px*var(--fs))}
.page .bar{height:5px;border-radius:3px;background:#EEF0F2;overflow:hidden}
.page .bar i{display:block;height:100%}
.page .gp{color:#1E8E5A}.page .rp{color:#D93F38}
.page .score{width:58px;height:58px;border-radius:50%;border:3px solid #E5A53A;display:grid;place-items:center;font-size:calc(22px*var(--fs));font-weight:800;color:#C9830F;flex:none}
.page .cover{background:#0E2A1F;color:#fff;padding:22px 16px}
.page .cover small{font-size:calc(8px*var(--fs));letter-spacing:.15em;opacity:.7}
.page .cover h2{margin:4px 0;font-size:calc(20px*var(--fs))}
@media (max-width:380px){.g4{grid-template-columns:repeat(2,1fr)}.catgrid{grid-template-columns:repeat(3,1fr)}.page .cards{grid-template-columns:repeat(2,1fr)}}
/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.pdots{display:flex;gap:14px}.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}.pdots i.f{background:var(--accent)}
.pinkeys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pinkeys button{height:72px;border-radius:50%;background:var(--card);font-size:calc(24px*var(--fs));font-weight:600}
.card.click.row{display:flex}.card.click.between{display:flex}
.sheet>*{flex-shrink:0}

/* cards that stack their rows: keep flex so the gap between rows applies */
.card.click.stack{display:flex}
.card.stack.s8{gap:11px}

/* =================================================================
   Premium Glassmorphism theme layer
   Sits on top of app.css: redefines surfaces and components only.
   Accent tones (--accent, --accent-ink, --accent-soft, --hdr-*) and
   typography (--f, --fs) are set at runtime from Settings.
   Blur is used only on floating chrome (bars, sheets, dialogs, menus,
   drawer) to stay smooth on lower-end phones; cards use layered
   translucency, a hairline border and soft shadows instead.
   ================================================================= */
:root{
  --bg:#0B1016; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.075); --line:rgba(255,255,255,.085); --field:rgba(255,255,255,.045);
  --fg:#EAF0F4; --muted:#95A2AF; --faint:#5F6C79;
  --pos:#4CC38A; --pos-ink:#06210F;
  --red:#F06A5F; --red-soft:rgba(240,106,95,.14); --orange:#F2B04A; --orange-soft:rgba(242,176,74,.14);
  --blue:#6E9BFF; --blue-soft:rgba(110,155,255,.14); --purple:#A48BFA; --purple-soft:rgba(164,139,250,.15);
  --glass-bd:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.07); --glass-grad:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.025) 60%);
  --bar:rgba(11,16,22,.68); --sheet:rgba(17,23,31,.86); --pop:rgba(24,31,41,.92);
  --shadow:0 18px 44px -20px rgba(0,0,0,.7); --shadow-sm:0 8px 22px -14px rgba(0,0,0,.65);
  --glow1:#4CC38A; --glow2:#5B8DEF;
  --r-card:20px; --r-ctl:14px; --r-in:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF2F6; --card:rgba(255,255,255,.66); --card2:rgba(15,23,42,.045); --line:rgba(15,23,42,.08); --field:rgba(255,255,255,.75);
  --fg:#0F1A24; --muted:#56636F; --faint:#93A0AC;
  --pos:#18884F; --pos-ink:#FFFFFF;
  --red:#D23B33; --red-soft:rgba(210,59,51,.1); --orange:#B76E0A; --orange-soft:rgba(183,110,10,.11);
  --blue:#2F62E0; --blue-soft:rgba(47,98,224,.1); --purple:#6B4FD8; --purple-soft:rgba(107,79,216,.1);
  --glass-bd:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,.95); --glass-grad:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.55) 65%);
  --bar:rgba(244,247,250,.74); --sheet:rgba(246,248,251,.9); --pop:rgba(255,255,255,.94);
  --shadow:0 18px 40px -20px rgba(30,45,70,.32); --shadow-sm:0 8px 20px -14px rgba(30,45,70,.3);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF2F6; --card:rgba(255,255,255,.66); --card2:rgba(15,23,42,.045); --line:rgba(15,23,42,.08); --field:rgba(255,255,255,.75);
  --fg:#0F1A24; --muted:#56636F; --faint:#93A0AC;
  --pos:#18884F; --pos-ink:#FFFFFF;
  --red:#D23B33; --red-soft:rgba(210,59,51,.1); --orange:#B76E0A; --orange-soft:rgba(183,110,10,.11);
  --blue:#2F62E0; --blue-soft:rgba(47,98,224,.1); --purple:#6B4FD8; --purple-soft:rgba(107,79,216,.1);
  --glass-bd:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,.95); --glass-grad:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.55) 65%);
  --bar:rgba(244,247,250,.74); --sheet:rgba(246,248,251,.9); --pop:rgba(255,255,255,.94);
  --shadow:0 18px 40px -20px rgba(30,45,70,.32); --shadow-sm:0 8px 20px -14px rgba(30,45,70,.3);
  color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* ---------- backdrop: soft, accent-tinted light fields behind the glass ---------- */
html{background:var(--bg)}
body{background:var(--bg);font-family:var(--f);font-size:calc(14px*var(--fs));letter-spacing:.005em}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 8% -8%,color-mix(in srgb,var(--glow1) 20%,transparent),transparent 62%),
    radial-gradient(55vmax 40vmax at 108% 22%,color-mix(in srgb,var(--glow2) 14%,transparent),transparent 60%),
    radial-gradient(50vmax 40vmax at 40% 112%,color-mix(in srgb,var(--glow1) 10%,transparent),transparent 60%);}
body::before{background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
button,input,select,textarea{font-family:inherit}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}

/* ---------- semantic colors stay fixed; the accent drives UI ---------- */
.green,.pos{color:var(--pos)}
.acc{color:var(--accent)}
.badge.green{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.prog.g i{background:var(--pos)}
.sethd{font-size:calc(13px*var(--fs));letter-spacing:.1em;text-transform:uppercase;margin:10px 0 -2px;font-weight:700}

/* ---------- glass surfaces ---------- */
.card,.txlist,.walletcard,.listbtn,.setrow,.iconfield,.search,.accchip,.catsq,.mi,.tile{
  background:var(--glass-grad),var(--card);border:1px solid var(--glass-bd);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi)}
.card{border-radius:var(--r-card)}
.txlist{border-radius:var(--r-card)}
.walletcard{border-radius:18px}
.listbtn,.setrow,.iconfield,.search{border-radius:16px}
.setrow{border-top:1px solid var(--glass-bd);position:relative}
.setrow::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.55}
.card.glow::after{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%)}
.card.topline{border-top:1px solid var(--glass-bd);position:relative}
.card.topline::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.tx{border-bottom:1px solid var(--line)}
.ic{background:var(--card2);border:1px solid var(--glass-bd)}
.ic.green{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.ic.red{border-color:color-mix(in srgb,var(--red) 22%,transparent)}
.ic.orange{border-color:color-mix(in srgb,var(--orange) 22%,transparent)}
.ic.blue{border-color:color-mix(in srgb,var(--blue) 22%,transparent)}
.ic.purple{border-color:color-mix(in srgb,var(--purple) 22%,transparent)}
.sec::before{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 40%,transparent))}

/* press feedback on tappable surfaces */
.card.click,.listbtn,.setrow,.walletcard,.mi,.tx,.catb,.catsq,.accchip,.swatch,.fontopt{transition:transform .16s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.card.click:active,.listbtn:active,.setrow:active,.walletcard:active,.mi:active,.accchip:active,.catsq:active,.swatch:active,.fontopt:active{transform:scale(.985)}
@media (hover:hover){.card.click:hover,.listbtn:hover,.setrow:hover,.walletcard:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--glass-bd))}}

/* ---------- floating chrome: real frosted glass ---------- */
.top{background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.top.green{background:linear-gradient(135deg,var(--hdr-green),var(--hdr-green2));color:#fff;border-bottom-color:transparent}
.nav{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.5)}
.nb{position:relative;transition:color .2s ease}
.nb.on::before{content:"";position:absolute;top:6px;width:46px;height:30px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);z-index:-1}
.nb.on{color:var(--accent)}
.nav-in{position:relative;z-index:0}
.fab{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent-strong));color:var(--accent-ink);border:1px solid color-mix(in srgb,#fff 30%,transparent);box-shadow:0 12px 28px -8px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .18s ease}
.fab:active{transform:scale(.94)}
.bottombar{background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.scrim,.dlgwrap,.drawer-scrim{background:rgba(5,8,12,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--sheet);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--glass-bd);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -20px 50px -24px rgba(0,0,0,.6);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.dlg{background:var(--pop);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-bd);border-radius:24px;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.menu{background:var(--pop);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-bd);border-radius:16px;box-shadow:var(--shadow);animation:pop .16s ease-out;transform-origin:top right}
.drawer{background:var(--sheet);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border-right:1px solid var(--glass-bd);box-shadow:20px 0 50px -24px rgba(0,0,0,.6)}
.dhead,.ghero{background:linear-gradient(140deg,var(--hdr-green),var(--hdr-green2))}
.ghero{border-radius:0 0 26px 26px;box-shadow:0 18px 40px -24px color-mix(in srgb,var(--hdr-green2) 80%,transparent)}
.ghero::after{border-color:rgba(255,255,255,.16)}
.ghero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.09),transparent 45%)}
.pillbox{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.smscard{background:linear-gradient(135deg,color-mix(in srgb,var(--purple) 22%,transparent),var(--card));border:1px solid color-mix(in srgb,var(--purple) 38%,transparent)}
.toast{background:var(--pop);color:var(--fg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--glass-bd);border-left:4px solid var(--accent);box-shadow:var(--shadow);animation:up .22s ease-out}
.toast.err{background:var(--pop);color:var(--fg);border-left-color:var(--red)}
.lock{background:var(--bg)}
.lock::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 45vmax at 50% 0%,color-mix(in srgb,var(--glow1) 22%,transparent),transparent 65%)}
.pinkeys button{background:var(--glass-grad),var(--card);border:1px solid var(--glass-bd);box-shadow:var(--shadow-sm)}
.pdots i{border-color:var(--accent)}.pdots i.f{background:var(--accent)}

/* ---------- controls ---------- */
.btn{border-radius:var(--r-ctl);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent-strong));color:var(--accent-ink);border:1px solid color-mix(in srgb,#fff 18%,transparent);box-shadow:0 10px 24px -14px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s ease,filter .2s ease,box-shadow .2s ease}
.btn:active{transform:scale(.98);filter:brightness(.97)}
.btn.out{background:var(--glass-grad),var(--card);color:var(--fg);border:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:var(--shadow-sm)}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--glass-bd);box-shadow:none}
.btn.red{background:linear-gradient(150deg,#F07A6F,#D9443A);color:#fff;box-shadow:0 10px 24px -14px rgba(217,68,58,.8)}
.btn.blue{background:linear-gradient(150deg,#6E9BFF,#2F62E0);color:#fff}

  const ratio=n.A?n.L/n.A:0;

function netWorth(){

}

function keepFocus(fn){

  fn();

}
/* ---------- in-place DOM patching ----------
   Re-renders update the existing elements instead of rebuilding them, so typing, tapping
   chips or the keypad never re-opens a sheet (no replayed slide-in animation), never resets
   horizontal scroll positions and never drops the keyboard or cursor. */
function morph(root,html){
  const tpl=document.createElement('template');tpl.innerHTML=html;
  patchKids(root,tpl.content);
}
function patchKids(a,b){
  const bk=[...b.childNodes];
  for(let i=0;i<bk.length;i++){
    const nb=bk[i];let na=a.childNodes[i];
    // keyed match: an element with the same id elsewhere moves into place instead of being rebuilt
    if(nb.nodeType===1&&nb.id&&(!na||na.id!==nb.id)){const m=[...a.childNodes].slice(i).find(x=>x.nodeType===1&&x.id===nb.id);if(m){a.insertBefore(m,na||null);na=m}}
    if(!na){a.appendChild(nb.cloneNode(true));continue}
    if(nb.nodeType===1&&na.nodeType===1&&nb.id&&na.id&&na.id!==nb.id){a.replaceChild(nb.cloneNode(true),na);continue}
    if(na.nodeType!==nb.nodeType||(na.nodeType===1&&na.tagName!==nb.tagName)){a.replaceChild(nb.cloneNode(true),na);continue}
    if(na.nodeType===3||na.nodeType===8){if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue;continue}
    patchEl(na,nb);
  }
  while(a.childNodes.length>bk.length)a.removeChild(a.lastChild);
}
function patchEl(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  const tag=a.tagName,active=a===document.activeElement;
  if(tag==='INPUT'){if(a.type==='checkbox'||a.type==='radio'){a.checked=b.hasAttribute('checked')}else if(!active&&a.type!=='file'&&a.value!==(b.getAttribute('value')||''))a.value=b.getAttribute('value')||'';return}
  if(tag==='TEXTAREA'){if(!active&&a.value!==b.textContent)a.value=b.textContent;return}
  patchKids(a,b);
  if(tag==='SELECT'&&!active){const o=[...b.options].findIndex(x=>x.hasAttribute('selected'));if(o>=0)a.selectedIndex=o}
}
function render(scrollTop){
  applyTheme();
  if(!UNLOCKED){renderLock();return}
  const c=cur();const fn=SCR[c.n]||SCR.home;let r;
  try{r=fn(c.p)}catch(err){console.error(err);r={top:hdr('Something went wrong'),html:`<div class="pad"><div class="card">${esc(err.message)}</div></div>`}}
  const isTab=TABS.includes(c.n);
  const html=`${r.top||''}<div class="screen">${r.html}</div>
    ${isTab?navBar(c.n,r.fab===false?'':(r.fab||fabBtn('quick'))):(r.fab===false?'':(r.fab||''))}${r.bottom||''}
    ${DRAWER?drawerHTML():''}`;
  // a new screen is drawn fresh; changes on the same screen are patched in place
  keepFocus(()=>{if(scrollTop||app.dataset.scr!==c.n){app.innerHTML=html;app.dataset.scr=c.n}else morph(app,html)});
  renderLayer();
  if(scrollTop)window.scrollTo(0,0);
  if(r.after)r.after();
}

  keepFocus(()=>{
    morph(layer,SH.map((s,i)=>{const z=60+i*2;const inner=s.render(s.st);

      +(MENU?menuHTML():''));

/* ---------- drag reorder (pointer) ---------- */
let DRG=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]');if(!h)return;const item=h.closest('[data-ri]');const list=item&&item.parentElement;if(!list)return;
  e.preventDefault();h.setPointerCapture&&h.setPointerCapture(e.pointerId);
  DRG={list,item,key:h.dataset.drag,startY:e.clientY,from:+item.dataset.ri,h:item.getBoundingClientRect().height+10};
  item.style.zIndex=5;item.style.position='relative';item.style.opacity='.85';
});
document.addEventListener('pointermove',e=>{if(!DRG)return;const dy=e.clientY-DRG.startY;DRG.item.style.transform=`translateY(${dy}px)`;DRG.to=clamp(DRG.from+Math.round(dy/DRG.h),0,DRG.list.children.length-1)});
document.addEventListener('pointerup',()=>{if(!DRG)return;const d=DRG;DRG=null;d.item.style.transform='';const to=d.to??d.from;if(to!==d.from){const f=A['reorder_'+d.key];f&&f(d.from,to)}else{d.item.style.opacity='';d.item.style.position=''}});
const moveIdx=(arr,f,t)=>{const [x]=arr.splice(f,1);arr.splice(t,0,x)};

/* ---------- calculator keypad ---------- */
function kpEval(expr){
  const s=String(expr).replace(/×/g,'*').replace(/÷/g,'/');if(!/^[\d.+\-*/\s]*$/.test(s)||!s)return 0;
  try{const toks=s.match(/\d*\.?\d+|[+\-*/]/g)||[];let out=[],ops=[];const pr={'+':1,'-':1,'*':2,'/':2};
    const ap=()=>{const b=out.pop()||0,a=out.pop()||0,o=ops.pop();out.push(o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:b?a/b:0)};
    let prevOp=true;for(const t of toks){if(/[+\-*/]/.test(t)){if(prevOp){if(t==='-'){out.push(0);ops.push('-');}continue}while(ops.length&&pr[ops[ops.length-1]]>=pr[t])ap();ops.push(t);prevOp=true}else{out.push(parseFloat(t));prevOp=false}}
    if(prevOp&&ops.length)ops.pop();while(ops.length)ap();return round2(out[0]||0)}catch(e){return 0}
}
function keypadHTML(st,cur){
  const shown=st.expr===''?'0':st.expr;
  return `<div class="kpd"><span class="sec cap" style="margin:0">${st.label||'Enter Amount'}</span><div class="expr">${/[+\-×÷]/.test(st.expr)?'= '+money(kpEval(st.expr),cur):''}</div><div class="val num"><small>${esc(sym(cur))}</small>${esc(shown)}</div></div>
  <div class="kp">${['7','8','9','÷','4','5','6','×','1','2','3','-','C','0','⌫','+','.','='].map(k=>`<button class="${'÷×-+'.includes(k)?'op':k==='C'?'c':k==='='?'eq':k==='⌫'?'op':''}" data-a="kp" data-k="${k}" aria-label="${k}">${k==='⌫'?ic('back',2):k}</button>`).join('')}</div>`;
}
A.kp=el=>{const st=topSheet().st;let e=st.expr,k=el.dataset.k;
  if(k==='C')e='';else if(k==='⌫')e=e.slice(0,-1);else if(k==='='){e=String(kpEval(e));if(e==='0')e=''}
  else if('÷×-+'.includes(k)){if(e===''&&k!=='-')return;if(/[÷×\-+]$/.test(e))e=e.slice(0,-1);e+=k}
  else if(k==='.'){const lastNum=e.split(/[÷×\-+]/).pop();if(lastNum.includes('.'))return;e+=lastNum===''?'0.':'.'}
  else{const lastNum=e.split(/[÷×\-+]/).pop();if(lastNum==='0')e=e.slice(0,-1);if((lastNum.split('.')[1]||'').length>=2)return;if(lastNum.replace('.','').length>=12)return;e+=k}
  st.expr=e;rs()};

function txRow(t,o={}){
  const a=acc(t.accId);const c=a?a.currency:S.settings.base;const base=S.settings.base;const inc=t.type==='income';
  const amtB=conv(t.amount,c,base);
  const note=t.note||(t.kind==='lend_give'?'Lending created: '+(t.who||''):t.kind==='lend_receive'?'Payment received for: '+(t.who||''):'');
  return `<button class="tx" data-a="txopen" data-id="${t.id}"><span class="ic ${inc?'':'red'}" style="${o.arrow?'':'font-size:calc(22px*var(--fs))'}">${o.arrow?ic(inc?'arrDL':'arrUR'):txIcon(t)}</span>
   <span class="grow" style="min-width:0"><span class="t ell" style="display:block">${esc(txTitle(t))}</span><span class="s ell" style="display:block">${esc(a?a.name:'Deleted account')}${t.time&&o.time?' · '+fT(t.time):''}</span>${note?`<span class="n ell" style="display:block">${esc(note)}</span>`:''}</span>
   <span class="a num ${inc?'green':'red'}">${money(o.accCur?t.amount:amtB,o.accCur?c:base)}${!o.accCur&&c!==base?`<small>${money(t.amount,c)}</small>`:''}</span></button>`;

function txGroups(list,o={}){
  const g={};list.slice().sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return Object.entries(g).map(([d,arr])=>{const inn=sum(arr.filter(t=>t.type==='income'),tBase),out=sum(arr.filter(t=>t.type==='expense'),tBase);
    const lbl=d===today()?'Today':d===addDays(today(),-1)?'Yesterday':fD(d).replace(/, \d{4}$/,'');
    return `<div class="dayhead"><span class="daychip"><b>${lbl}</b><i>${WD[D(d).getDay()]}</i></span><span class="tt num">${inn?`<span class="green">↑ ${B(inn)}</span>`:''}${out?`<span class="red">↓ ${B(out)}</span>`:''}</span></div><div class="txlist">${arr.map(t=>txRow(t,o)).join('')}</div>`}).join('');
}
async function fileToDataURL(file,max=1000){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{if(!file.type.startsWith('image/')){res(r.result);return}
    const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=()=>res(r.result);img.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}
/* Share sheet on the phone (Android app / mobile browser); copies the text everywhere else */
async function shareText(title,text){
  const SP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;
  try{if(SP){await SP.share({title,text,dialogTitle:'Share '+title});return}}catch(e){if(String(e&&e.message).includes('cancel'))return}
  try{if(navigator.share&&STANDALONE){await navigator.share({title,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  copyText(text,'Copied. Paste it anywhere to share.');
}
function copyText(t,msg='Copied'){
  const done=()=>toast(msg);
  try{navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}
}
function fallbackCopy(t){openSheet(()=>`<h3>Copy</h3><p class="small muted" style="margin:0">Select the text below and copy it.</p><div class="fld"><textarea id="copyfall" readonly style="min-height:180px">${esc(t)}</textarea></div><button class="btn w" data-a="close">Done</button>`,{});setTimeout(()=>{const e=document.getElementById('copyfall');e&&e.select()},50)}
function downloadFile(name,content,type){ // standalone only
  try{const blob=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},800);return true}catch(e){return false}
}

function trendCard(mk){
  const n=daysIn(mk),isW=U.trend==='weekly';
  const days=isW?Array.from({length:7},(_,i)=>addDays(today(),i-6)):Array.from({length:n},(_,i)=>mk+'-'+pad(i+1));
  const by={};S.txns.forEach(t=>{if(!days.includes(t.date))return;const o=by[t.date]=by[t.date]||{i:0,e:0,ci:0,co:0};const v=tBase(t);if(isInc(t))o.i+=v;if(isExp(t))o.e+=v;if(isCashIn(t))o.ci+=v;if(isCashOut(t))o.co+=v});
  const ser=[['i','Income','var(--pos)'],['e','Expense','var(--red)'],['ci','Cash In','#7BD8A6'],['co','Cash Out','var(--orange)']];
  const W=320,H=150,pl=34,pb=18,pt=8;const max=Math.max(1,...days.map(d=>Math.max(...ser.map(s=>(by[d]||{})[s[0]]||0))));
  const x=i=>pl+(W-pl-6)*(days.length===1?0:i/(days.length-1)),y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';for(let i=0;i<=3;i++){const v=max*i/3;g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${compact(v)}</text>`}
  const ticks=isW?days.map((d,i)=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${WD[D(d).getDay()]}</text>`).join(''):[0,5,10,15,20,25,n-1].filter((v,i,a)=>a.indexOf(v)===i&&v<n).map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${i+1}</text>`).join('');
  const lines=ser.map(s=>`<polyline fill="none" stroke="${s[2]}" stroke-width="2" stroke-linejoin="round" points="${days.map((d,i)=>x(i).toFixed(1)+','+y((by[d]||{})[s[0]]||0).toFixed(1)).join(' ')}"/>`).join('');
  const sel=U.trendDay!=null&&U.trendDay<days.length?U.trendDay:null;
  let tip='';if(sel!=null){const o=by[days[sel]]||{};const tx=x(sel);tip=`<line x1="${tx}" x2="${tx}" y1="${pt}" y2="${H-pb}" stroke="var(--accent)" stroke-dasharray="3 3"/><circle cx="${tx}" cy="${y(o.co||0)}" r="4" fill="var(--orange)"/>`;}
  const hits=days.map((d,i)=>`<rect x="${x(i)-(W-pl)/days.length/2}" y="0" width="${(W-pl)/days.length}" height="${H}" fill="transparent" data-a="trendday" data-i="${i}"/>`).join('');
  const o=sel!=null?(by[days[sel]]||{}):null;
  return `<section class="card stack s8"><div class="between"><span class="h2">${T('Spending Trend')}</span><button class="link" data-a="tab" data-n="analytics">View all</button></div>
  <div class="between wrap"><div class="legend">${ser.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}</div><select class="inp" style="width:auto;padding:6px 10px;font-size:calc(12px*var(--fs))" data-ch="trendmode" id="trendmode" aria-label="Trend period"><option value="monthly" ${!isW?'selected':''}>Monthly</option><option value="weekly" ${isW?'selected':''}>Weekly</option></select></div>
  <div style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" class="chart" role="img" aria-label="Daily income and spending">${g}${ticks}${lines}${tip}${hits}</svg>
  ${o?`<div class="card tight tiny" style="position:absolute;top:0;${sel>days.length/2?'left:40px':'right:4px'};background:var(--card2)"><b>${fD(days[sel])}</b><div class="green">Income ${B(o.i||0)}</div><div class="red">Expense ${B(o.e||0)}</div><div style="color:#7BD8A6">Cash In ${B(o.ci||0)}</div><div class="orange">Cash Out ${B(o.co||0)}</div></div>`:''}</div></section>`;
}
A.trendmode=el=>{U.trend=el.value;U.trendDay=null;render()};
A.trendday=el=>{const i=+el.dataset.i;U.trendDay=U.trendDay===i?null:i;render()};

function defaultAcc(){return (S.accounts.find(a=>a.isDefault)||wallets()[0]||S.accounts[0]||{}).id}
A.addtx=el=>{const type=el.dataset.t;closeSheet(true);if(!S.accounts.length){toast('Create an account first',true);go('accounts');return}
  catPicker(type,catId=>calcSheet({type,catId,accId:defaultAcc(),expr:'',date:today(),time:nowTime(),tags:[],note:'',receipt:null,planId:null}))};
function calcSheet(st){
  openSheet(st=>`<div class="sh"><span class="row"><span style="font-size:calc(26px*var(--fs))">${cat(st.catId)?.icon||''}</span><b>${esc(cat(st.catId)?.name||'')}</b><span class="badge ${st.type==='income'?'green':'red'}">${st.type==='income'?'Income':'Expense'}</span></span><button class="link" data-a="calccat">Change</button></div>
   ${accChips(st.accId,'calcacc')}${keypadHTML(st,accCur(st.accId))}
   <div class="btns"><button class="btn" data-a="calcquick">Quick Save</button><button class="btn out" data-a="calcmore">Add More Details</button></div>`,st);
}
A.calcacc=el=>{topSheet().st.accId=el.dataset.id;rs()};
A.calccat=()=>{const st=topSheet().st;catPicker(st.type,id=>{st.catId=id;rs()})};
A.calcquick=()=>{const st=topSheet().st;const v=kpEval(st.expr);if(!(v>0)){toast('Enter an amount above zero',true);return}saveNewTx(st,v)};
A.calcmore=()=>{const st=topSheet().st;const v=kpEval(st.expr);if(!(v>0)){toast('Enter an amount above zero',true);return}st.amount=v;detailsSheet(st)};
function saveNewTx(st,v){
  const t={id:uid(),type:st.type,kind:'normal',catId:st.catId,accId:st.accId,amount:round2(v),date:st.date,time:st.time,note:st.note||'',tags:st.tags||[],receipt:st.receipt||null,planId:st.planId||null};
  S.txns.push(t);
  if(st.recId){const r=S.recurring.find(x=>x.id===st.recId);if(r){t.kind='recurring';r.payments.push({id:uid(),amount:t.amount,date:t.date,accId:t.accId,txId:t.id,due:r.next});r.next=nextRecurring(r,r.next)}}
  closeSheet(true);save();render();toast('Successfully saved transaction');
}
function detailsSheet(base){
  openSheet(st=>`<h3 style="text-align:center">Add Note, Tags, Receipt, or Date</h3>
   <div class="sec cap">Date &amp; Time</div><div class="g2"><label class="card tight"><span class="tiny green b row">${ic('cal')} DATE</span><input type="date" id="dt_d" class="inp" style="border:0;padding:4px 0;background:transparent;font-weight:700" value="${st.date}" data-ch="dtd"></label><label class="card tight"><span class="tiny green b row">${ic('clock')} TIME</span><input type="time" id="dt_t" class="inp" style="border:0;padding:4px 0;background:transparent;font-weight:700" value="${st.time}" data-ch="dtt"></label></div>
   ${st.type==='expense'?`<div class="sec cap">Spending Plan <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">(Optional)</span></div>${planRow(st.planId,'dtplan')}`:''}
   <div class="sec cap">Tags</div>${tagChips(st.tags,'dttag')}
   <div class="sec cap">Note</div><div class="fld"><textarea id="dt_note" placeholder="Add a note..." data-in="dtnote">${esc(st.note)}</textarea></div>
   <div class="sec cap">Receipt</div>${receiptBox(st.receipt,'dtrec')}
   <button class="btn w" data-a="dtsave">Save</button>`,base,{full:true});
}

A.dttag=el=>{const st=topSheet().st;const n=el.dataset.v;st.tags=st.tags.includes(n)?st.tags.filter(x=>x!==n):[...st.tags,n];rs()};
A.dtplan=()=>{const st=topSheet().st;pickPlan(st.planId,id=>{st.planId=id;rs()})};
A.dtrec=el=>{};
A.dtsave=()=>{const st=topSheet().st;saveNewTx(st,st.amount)};
function planRow(planId,act){const p=S.splans.find(x=>x.id===planId)||S.plans.find(x=>x.id===planId);return `<div class="card row"><button class="row grow" style="text-align:left;min-width:0" data-a="${act}"><span class="ic green">${ic('cal')}</span><span class="grow" style="min-width:0"><span class="tiny green b">SPENDING PLAN</span><div class="small ${p?'b':'muted'}">${p?esc(p.name):'Select a spending plan'}</div></span></button>${p?`<button class="ib red" data-a="${act}clr" aria-label="Remove spending plan">${ic('x')}</button>`:ic('chevR')}</div>`}
function pickPlan(sel,cb){const L=S.splans.slice().sort((a,b)=>(splanActive(b)-splanActive(a))||b.start.localeCompare(a.start));
  listPicker('Select Spending Plan',L.map(p=>({v:p.id,l:p.name,sub:(p.desc?p.desc+' · ':'')+splanRange(p),icon:ic('cal')})),cb,{search:'Search spending plans...',none:'None',sel,empty:'No spending plans found',full:true})}
A.dtplanclr=()=>{topSheet().st.planId=null;rs()};A.edplanclr=()=>{U.edit.planId=null;render()};
function tagChips(sel,act){return `<div class="card tight chips wrap" style="flex-wrap:wrap">${S.tags.map(t=>`<button class="chip soft ${sel.includes(t.name)?'on':''}" data-a="${act}" data-v="${esc(t.name)}">${esc(t.name)}</button>`).join('')}<button class="chip" style="border-color:var(--accent);color:var(--accent)" data-a="addtagq">+ Add tag</button></div>`}
A.addtagq=()=>tagDialog(null,()=>rs());
function receiptBox(rec,act){
  return rec?`<div class="stack s8"><img class="receipt" src="${rec}" alt="Receipt"><button class="textbtn red" data-a="recclear">Remove receipt</button></div>`
   :`<button class="dashed" style="width:100%" data-a="recpick">${ic('upload')}<span>Click here to upload a receipt</span></button>`;
}
A.recpick=()=>{const host=topSheet();openSheet(()=>`<h3 style="text-align:center">Add Receipt</h3><div class="g2"><label class="card click" style="text-align:center;cursor:pointer"><span class="ic lg green" style="margin:0 auto 8px;border-radius:50%">${ic('camera')}</span>Camera<input type="file" accept="image/*" capture="environment" hidden data-ch="recfile"></label><label class="card click" style="text-align:center;cursor:pointer"><span class="ic lg green" style="margin:0 auto 8px;border-radius:50%">${ic('image')}</span>Gallery<input type="file" accept="image/*,application/pdf" hidden data-ch="recfile"></label></div>`,{host})};
A.recfile=async el=>{const f=el.files[0];if(!f)return;const st=topSheet().st;const data=await fileToDataURL(f);closeSheet();if(st.host){st.host.st.receipt=data;rs()}else{U.edit.receipt=data;render()}};

A.txopen=el=>go('txDetail',{id:el.dataset.id});
SCR.txDetail=p=>{
  const t=S.txns.find(x=>x.id===p.id);if(!t)return {top:hdr('Transaction Details'),html:emptyState('inbox','Transaction not found')};
  const a=acc(t.accId),c=a?a.currency:S.settings.base,base=S.settings.base,inc=t.type==='income';
  const tm=t.time?(t.time.length===5?t.time+':00':t.time):'—';
  const rows=[['cat','Category',txTitle(t)],['wallet','Payment Method',a?a.name:'Deleted account'],['cal','Date',fDslash(t.date)],['clock','Time',tm]];
  if(c!==base){rows.push(['coin','Original Amount',(+t.amount).toFixed(2)+' '+c]);rows.push(['fx','Conversion Rate',`1 ${c} = ${rateOf(c,base).toFixed(4)} ${base}`])}
  if(t.note)rows.push(['note','Note',t.note]);
  return {top:hdr('Transaction Details').replace('class="top pad"','class="top pad" style="background:var(--tx-hero)"'),
   html:`<div style="background:linear-gradient(180deg,var(--tx-hero),var(--bg));padding:18px 0 26px;text-align:center">
   <span style="display:grid;place-items:center;margin:0 auto 16px;width:84px;height:84px;border-radius:50%;background:color-mix(in srgb,${inc?'var(--pos)':'var(--red)'} 18%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,${inc?'var(--pos)':'var(--red)'} 8%,transparent)"><span class="ic" style="width:52px;height:52px;border-radius:50%;background:${inc?'var(--pos)':'var(--red)'};color:${inc?'var(--pos-ink)':'#fff'}">${ic(inc?'check':'arrUR',2.6)}</span></span>
   <div class="big num ${inc?'green':'red'}" style="font-size:calc(30px*var(--fs))">${B(tBase(t))}</div><div class="h2" style="margin-top:6px">${esc(txTitle(t))}</div>
   <span class="badge green" style="margin-top:10px;border:1px solid var(--pos);padding:4px 12px">${ic('check',2.4).replace('<svg','<svg style="width:12px;height:12px"')} Success</span></div>
   <div class="pad stack"><div class="card">${rows.map(([i,k,v],n)=>`<div class="row" style="padding:13px 0;${n<rows.length-1?'border-bottom:1px solid var(--line)':''}"><span class="muted" style="width:26px">${ic(i)}</span><span class="grow muted">${k}</span><b style="text-align:right;max-width:60%;overflow-wrap:anywhere">${esc(v)}</b></div>`).join('')}</div>
   <div class="card"><div class="row"><span class="muted">${ic('tag')}</span><b>Tags</b></div><div class="chips wrap" style="flex-wrap:wrap;margin-top:8px">${(t.tags||[]).map(x=>`<span class="chip soft on">${esc(x)}</span>`).join('')||'<span class="small muted">No tags</span>'}</div></div>
   ${t.receipt?`<div class="card stack s8"><b>Receipt</b><img class="receipt" src="${t.receipt}" alt="Receipt"></div>`:''}</div>`,
   bottom:`<div class="bottombar pad"><div class="btns"><button class="btn" data-a="txedit" data-id="${t.id}">${ic('edit')} Edit</button><button class="btn out" style="border-color:var(--red);color:var(--red)" data-a="txdel" data-id="${t.id}">${ic('trash')} Delete</button></div></div>`,fab:false};
};
/* Initial balances, corrections, transfers and other app-created entries: edit amount, date, time and note */
function txQuickEdit(t){const a=acc(t.accId);
  openSheet(st=>`<h3>Edit ${esc(txTitle(t))}</h3><div class="fld"><label for="qe_a">Amount (${a?a.currency:S.settings.base})</label><input id="qe_a" inputmode="decimal" value="${esc(st.amount)}" data-in="qef" data-k="amount"></div>
   <div class="g2"><div class="fld"><label for="qe_d">Date</label><input type="date" id="qe_d" value="${st.date}" data-ch="qef" data-k="date"></div><div class="fld"><label for="qe_t">Time</label><input type="time" step="1" id="qe_t" value="${st.time}" data-ch="qef" data-k="time"></div></div>
   <div class="fld"><label for="qe_n">Note</label><textarea id="qe_n" data-in="qef" data-k="note">${esc(st.note)}</textarea></div>${t.pair?'<span class="tiny muted">The other side of this transfer is updated too.</span>':''}${st.err?`<span class="err">${st.err}</span>`:''}
   <div class="btns"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="qesave">Save</button></div>`,{id:t.id,amount:String(t.amount),date:t.date,time:t.time||'',note:t.note||''})}
A.qef=el=>{topSheet().st[el.dataset.k]=el.value};
A.qesave=()=>{const st=topSheet().st;const v=parseFloat(st.amount);if(!(v>0)){st.err='Enter an amount above zero.';rs();return}const t=S.txns.find(x=>x.id===st.id);
  const old=t.amount;Object.assign(t,{amount:round2(v),date:st.date,time:st.time,note:st.note});
  if(t.pair){const o=S.txns.find(x=>x.id===t.pair);if(o){o.date=st.date;o.time=st.time;o.note=st.note;o.amount=round2(o.amount*v/old)}}
  closeSheet();commit('Transaction updated')};
A.txedit=el=>{const t=S.txns.find(x=>x.id===el.dataset.id);if(!['normal','recurring','sub','inst'].includes(t.kind||'normal')){txQuickEdit(t);return}U.edit={...t,tags:[...(t.tags||[])]};go('txEdit',{})};
A.txdel=el=>{const id=el.dataset.id;confirmDel('Delete transaction?','This removes it and updates your account balance.',()=>{const t=S.txns.find(x=>x.id===id);S.txns=S.txns.filter(x=>x.id!==id&&!(t&&t.pair&&x.id===t.pair));back();commit('Transaction deleted')})};
SCR.txEdit=()=>{
  const e=U.edit;if(!e)return SCR.home();const isNew=!S.txns.some(x=>x.id===e.id);const inc=e.type==='income';
  const recent=[...new Set(S.txns.filter(t=>t.type===e.type&&t.catId).slice(-60).reverse().map(t=>t.catId))].filter(id=>cat(id)&&id!==e.catId).slice(0,3);
  const shown=[e.catId,...recent].filter(id=>id&&cat(id));
  return {top:'',html:`<div class="ghero pad" style="padding-top:0">${hdr((isNew?'Add ':'Edit ')+(inc?'Income':'Expense'),{green:true}).replace('class="top pad green"','class="top green" style="background:transparent;position:static"')}
   <button class="amtbar" data-a="edamt" style="width:100%;color:inherit;text-align:left"><span class="k">Amount<small>(Please enter amount)</small></span><span class="v num">${money(e.amount||0,accCur(e.accId))}</span></button></div>
   <div class="pad stack" style="margin-top:14px">
   <div class="between"><span class="sec">Category</span><button class="btn sm ghost" data-a="edcatnew">${ic('plus',2)} Add New</button></div>
   <div class="catrow">${shown.map(id=>`<button class="catsq ${id===e.catId?'on':''}" data-a="edcat" data-id="${id}"><span class="e">${cat(id).icon}</span><span>${esc(cat(id).name)}</span></button>`).join('')}<button class="chip" style="align-self:center" data-a="edcatmore">More ›</button></div>
   ${!inc?`<span class="sec">Spending Plan (Optional)</span>${planRow(e.planId,'edplan')}`:''}
   <div class="g2"><div class="fld"><span class="sec">Date</span><input type="date" class="inp" id="ed_date" value="${e.date}" data-ch="eddate"></div><div class="fld"><span class="sec">Time</span><input type="time" class="inp" id="ed_time" value="${e.time||''}" data-ch="edtime"></div></div>
   ${accChips(e.accId,'edacc')}
   <span class="sec">Tags</span>${tagChips(e.tags||[],'edtag')}
   <span class="sec">Note</span><div class="fld"><textarea id="ed_note" placeholder="Add a note" data-in="ednote">${esc(e.note||'')}</textarea></div>
   <span class="sec">Receipt</span>${receiptBox(e.receipt,'')}

  const a={id:uid(),name,currency:st.cur,type:'wallet',include:true,isDefault:!wallets().length};S.accounts.push(a);

function doTransfer(from,to,amt,fee,date,note){
  const fa=acc(from),ta=acc(to);const toAmt=round2(conv(amt,fa.currency,ta.currency));const g=uid();
  const o={id:uid(),type:'expense',kind:'transfer_out',accId:from,amount:round2(amt),date,time:nowTime(),note,tags:[],group:g,peer:to};
  const i={id:uid(),type:'income',kind:'transfer_in',accId:to,amount:toAmt,date,time:nowTime(),note,tags:[],group:g,peer:from};
  o.pair=i.id;i.pair=o.id;S.txns.push(o,i);
  if(fee>0)S.txns.push({id:uid(),type:'expense',kind:'bank_fee',catId:S.categories.find(c=>c.name==='Bank Charges')?.id,accId:from,amount:round2(fee),date,time:nowTime(),note:'Transfer fee',tags:[],group:g});
}

/* ---------------- SMS automation ---------------- */
const BANK_SENDERS=/\b(BOC|COMBANK|COM ?BANK|HNB|SAMPATH|NDB|SEYLAN|NTB|NATIONS ?TRUST|DFCC|PEOPLES|PEOPLE'?S BANK|PAN ASIA|UNION ?BANK|AMANA|CARGILLS ?BANK|NSB|HSBC|SCB|CITI|BML|MIB|SBI|HDFC|ICICI|AXIS|HBL|MCB|UBL|MEEZAN)\b/i;
const MERCH_CATS=[[/keells|cargills|food ?city|laugfs|arpico|spar|glomark|super/i,'Groceries'],[/uber|pickme|taxi|bus|train/i,'Transport'],[/fuel|petrol|ceypetco|ioc|lanka ioc|shed/i,'Fuel'],[/dialog|mobitel|hutch|airtel|slt/i,'Phone'],[/ceb|leco|electric/i,'Electricity'],[/water|nwsdb/i,'Water'],[/kfc|pizza|mcdonald|burger|cafe|coffee|restaurant|hotel/i,'Dining'],[/daraz|odel|amazon|fashion|store|mall|shop/i,'Shopping'],[/pharm|hospital|clinic|osu|medical|lab|healthguard/i,'Meds'],[/netflix|spotify|youtube|cinema|scope|ticket/i,'Entertainment'],[/salary|payroll/i,'Salary'],[/interest/i,'Interest']];
function parseSMS(raw){
  const txt=raw.trim();if(!txt)return null;
  if(/\b(otp|one[- ]?time|verification code|passcode|pin is|do not share)\b/i.test(txt))return {skip:'OTP'};
  const am=txt.match(/(?:LKR|Rs\.?|INR|PKR|MVR|USD|BDT|AED)\s*([\d,]+(?:\.\d{1,2})?)/i)||txt.match(/\b(\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d+\.\d{2})\b/);
  const isInc=/\b(credited|credit(?:ed)? to|deposit(ed)?|received|salary|refund(ed)?|cr\b|incoming)/i.test(txt);
  const isExp=/\b(debited|debit|purchase|spent|withdraw(n|al)?|paid|payment|txn|transaction at|pos\b|dr\b|charged)/i.test(txt);
  if(/\b(offer|promo|win|discount|% ?off|click|reward points|hurry|limited time|sale)\b/i.test(txt)&&!(isInc||isExp))return {skip:'Promotion'};
  if(!am||!(isInc||isExp))return {skip:'Not a bank transaction'};
  const curm=txt.match(/\b(LKR|INR|PKR|MVR|USD|BDT|AED)\b/i);
  const amount=parseFloat(am[1].replace(/,/g,''));const type=isInc&&!/\bdebited\b/i.test(txt)?'income':'expense';
  let merchant='';const mm=txt.match(/\b(?:at|to|from|@)\s+([A-Za-z][A-Za-z0-9 &.'\-]{1,32}?)(?=\s+(?:on|for|ref|avl|avail|bal|via|\d)|[.,;]|$)/i);
  if(mm)merchant=mm[1].trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  let catName=type==='income'?'Other Income':'Other';const pick=src=>{for(const [re,n] of MERCH_CATS)if(re.test(src)){const c=S.categories.find(x=>x.name===n&&x.kind===type);if(c){catName=n;return true}}return false};if(!(merchant&&pick(merchant)))pick(txt);
  const c=S.categories.find(x=>x.name===catName&&x.kind===type)||S.categories.find(x=>x.kind===type);
  let date=today();const dm=txt.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);if(dm&&+dm[2]>=1&&+dm[2]<=12&&+dm[1]<=31){const y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):today().slice(0,4);date=`${y}-${pad(dm[2])}-${pad(dm[1])}`;if(date>today())date=today()}
  const bank=(txt.match(BANK_SENDERS)||[''])[0];
  const red=txt.replace(/\b[X*x•]{2,}\s?\d{2,6}\b/g,'••••').replace(/\b\d{8,}\b/g,'••••').replace(/(?:Avl|Avail(?:able)?)\.?\s*Bal[^.]*\.?/ig,'').trim();
  const a=S.accounts.find(x=>bank&&x.name.toUpperCase().includes(bank.toUpperCase().replace(/\s/g,'').slice(0,3)))||S.accounts.find(x=>x.currency===(curm?curm[1].toUpperCase():S.settings.base)&&x.type!=='credit')||S.accounts[0];
  return {id:uid(),amount,type,merchant,catId:c?.id,accId:a?.id,date,raw:red,bank};
}
SCR.smsSetup=()=>({top:hdr('SMS Automation'),html:`<div class="pad stack"><div class="card glow stack"><span class="ic lg purple">${ic('sparkle')}</span><b style="font-size:calc(17px*var(--fs))">Auto-track bank SMS</b><p class="small muted" style="margin:0">Your bank already texts you for every purchase, transfer and salary credit. Paste those messages into the SMS Parser and ${APP_NAME} turns each one into a ready-to-review draft with amount, merchant, category and account filled in.</p></div>
  <div class="card stack s8">${[['1','Copy bank SMS','Open your messages app and copy one or more bank messages.'],['2','Paste into SMS Parser','OTPs and promotions are skipped, account numbers are masked.'],['3','Review & save','Drafts land in SMS Drafts. Tap Save, and it’s recorded.']].map(([n,t,s])=>`<div class="row" style="align-items:flex-start"><span class="ic green b">${n}</span><span><b>${t}</b><div class="small muted">${s}</div></span></div>`).join('')}</div>
  <div class="card row small muted" style="align-items:flex-start">${ic('shield')}<span>Everything is processed on this device. A web app can't read your SMS inbox directly, so messages are pasted in. The Android app build can read them automatically once you grant SMS permission.</span></div>
  <button class="btn w" data-a="go" data-n="smsParser">Open SMS Parser</button></div>`,fab:false});
SCR.smsParser=()=>({top:hdr(T('SMS Parser')),html:`<div class="pad stack"><div class="fld"><label for="smsin">Paste bank SMS (separate messages with a blank line)</label><textarea id="smsin" style="min-height:180px" placeholder="e.g. LKR 3,450.00 debited from A/C XXXX4521 at KEELLS SUPER on 30/10/2026. Avl Bal LKR 52,310.00"></textarea></div>
  <div class="btns"><button class="btn" data-a="smsparse">Parse Messages</button><button class="btn ghost" data-a="smssample">Try sample</button></div>
  <p class="small muted">Recognised: amounts in LKR/Rs/USD/MVR/INR, debit and credit keywords, merchant names, dates, and 30+ bank names including BOC, ComBank, HNB, Sampath, NDB, Seylan and NTB.</p></div>`,fab:false});
A.smssample=()=>{const d=today();const dd=d.slice(8)+'/'+d.slice(5,7);document.getElementById('smsin').value=`BOC: LKR 3,450.00 debited from A/C XXXX4521 at KEELLS SUPER on ${dd}. Avl Bal LKR 52,310.00\n\nYour OTP for online payment is 482910. Do not share.\n\nCOMBANK: LKR 145,000.00 credited to A/C ****8812 SALARY from ABC PVT LTD on ${dd}.\n\nHNB: Purchase of Rs 1,890.00 at DIALOG AXIATA on card ending 7781 was successful.\n\nMEGA SALE! 40% off at partner stores this weekend. Click to claim.`};
A.smsparse=()=>{const parts=document.getElementById('smsin').value.split(/\n\s*\n/);let ok=0,sk=[];parts.forEach(p=>{const r=parseSMS(p);if(!r)return;if(r.skip)sk.push(r.skip);else{S.smsDrafts.push(r);ok++}});save();
  if(ok){go('smsDrafts');toast(`${ok} draft${ok>1?'s':''} created${sk.length?` · ${sk.length} skipped`:''}`)}else toast(sk.length?`Nothing to add · skipped ${[...new Set(sk)].join(', ')}`:'Paste at least one message',true)};
SCR.smsDrafts=()=>({top:hdr(T('SMS Drafts'),{right:S.smsDrafts.length>1?`<button class="link" data-a="smssaveall">Save all</button>`:''}),html:`<div class="pad stack">${S.smsDrafts.length?S.smsDrafts.map(d=>`<div class="card stack s8"><div class="between"><span class="row"><span class="ic ${d.type==='income'?'green':'red'}" style="font-size:calc(20px*var(--fs))">${cat(d.catId)?.icon||'💸'}</span><span><b>${esc(d.merchant||cat(d.catId)?.name||'Bank transaction')}</b><div class="tiny muted">${esc(cat(d.catId)?.name||'')} · ${esc(accName(d.accId))} · ${fD(d.date)}</div></span></span><b class="num ${d.type==='income'?'green':'red'}">${money(d.amount,accCur(d.accId))}</b></div><div class="tiny muted" style="font-family:ui-monospace,monospace;overflow-wrap:anywhere;background:var(--card2);padding:8px;border-radius:8px">${esc(d.raw)}</div><div class="btns"><button class="btn sm" data-a="smsreview" data-id="${d.id}">Review &amp; Save</button><button class="btn sm ghost" data-a="smsdel" data-id="${d.id}">Dismiss</button></div></div>`).join('')
  :`<div class="card" style="text-align:center;padding:28px 18px;margin-top:40px"><span class="ic lg green" style="margin:0 auto 12px;border-radius:50%">${ic('shield')}</span><b>No SMS drafts</b><p class="small muted">Paste bank messages into the SMS Parser to create drafts here.</p><button class="btn" data-a="go" data-n="smsParser">Open SMS Parser</button></div>`}</div>`,fab:false});
A.smsdel=el=>{S.smsDrafts=S.smsDrafts.filter(x=>x.id!==el.dataset.id);commit()};
A.smsreview=el=>{const d=S.smsDrafts.find(x=>x.id===el.dataset.id);S.smsDrafts=S.smsDrafts.filter(x=>x.id!==d.id);U.edit={id:uid(),type:d.type,kind:'normal',catId:d.catId,accId:d.accId,amount:d.amount,date:d.date,time:nowTime(),note:d.merchant,tags:[],receipt:null,planId:null};save();go('txEdit')};
A.smssaveall=()=>{const n=S.smsDrafts.length;S.smsDrafts.forEach(d=>S.txns.push({id:uid(),type:d.type,kind:'normal',catId:d.catId,accId:d.accId,amount:d.amount,date:d.date,time:nowTime(),note:d.merchant,tags:['SMS'],receipt:null}));S.smsDrafts=[];commit(n+' transactions saved')};

/* ---------------- Monthly plan ---------------- */
const planAlloc=p=>({exp:sum(p.expenses,x=>x.amount),loan:sum(p.loans,x=>x.amount),card:sum(p.cards,x=>x.amount),goal:sum(p.goals,x=>x.amount)});
const planTotal=p=>{const a=planAlloc(p);return a.exp+a.loan+a.card+a.goal};
function planSpent(p){const [f,t]=[monthStart(p.month),monthEnd(p.month)];const ids=p.expenses.flatMap(x=>catAndSubs(x.catId));return sum(S.txns.filter(x=>x.type==='expense'&&inRange(x,f,t)&&(x.planId===p.id||ids.includes(x.catId))),tBase)}
SCR.plans=()=>{const P=cur().p;return {top:hdr(T('Monthly Plan'),{center:true,right:rbtn('planinfo','info','','About plans')+rbtn('go','chart','data-n="planOverview"','Monthly overview')}),
  after:()=>{if(!S.settings.planIntroHide&&!P._intro){P._intro=1;A.planinfo()}},
  html:`<div class="pad stack">${S.plans.length?S.plans.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(p=>{const tot=planTotal(p),sp=planSpent(p),a=planAlloc(p);const pr=a.exp?sp/a.exp:0;
   return `<button class="card click stack s8" data-a="go" data-n="plan" data-p='{"id":"${p.id}"}'><div class="between"><b>${esc(p.name)}</b><b class="green num">${B(p.income-tot)}</b></div><div class="tiny muted">${fML(p.month)}</div><div class="between tiny muted" style="border-top:1px solid var(--line);padding-top:8px"><span>Total Allocated ${B(tot)}</span><span>${B(p.income)} Income</span></div>${prog(pr,pr>1?'r':'')}<div class="between tiny"><span class="${pr>1?'red':'green'}">${Math.round(pr*100)}% ● ${pr>1?'Over plan':'On Track'}</span><b class="green num">${B(p.income-tot)} left</b></div></button>`}).join('')
  :emptyState('plan','No monthly plans yet','Split your salary across expenses, loans, cards and savings',`<button class="btn" data-a="planew">${ic('plus',2)} Create Monthly Plan</button>`)}</div>`,fab:fabBtn('planew',true)}};

SCR.planOverview=()=>{const L=S.plans.slice().sort((a,b)=>b.month.localeCompare(a.month));if(!L.length)return {top:hdr('Monthly Overview',{center:true}),html:emptyState('plan','No monthly plans yet','Create a plan to compare planned and actual spending'),fab:false};
  const pl=L.find(x=>x.id===U.ovPlan)||L.find(x=>x.month===ym(today()))||L[0];const f=monthStart(pl.month),t=monthEnd(pl.month);
  const rows=[];
  pl.expenses.forEach(x=>{const act=sum(S.txns.filter(q=>q.type==='expense'&&inRange(q,f,t)&&catAndSubs(x.catId).includes(q.catId)),tBase);rows.push({name:cat(x.catId)?.name||'Category',icon:cat(x.catId)?.icon||'📦',plan:x.amount,act,sec:'Categories'})});
  pl.loans.forEach(x=>{const l=S.loans.find(y=>y.id===x.loanId);const act=l?sum(l.payments.filter(q=>inRange(q,f,t)),q=>conv(q.amount,lcur(l),S.settings.base)):0;rows.push({name:l?l.name:'Loan',icon:'🏦',plan:x.amount,act,sec:'Loan Payments'})});
  pl.cards.forEach(x=>{const c=acc(x.accId);const act=sum(S.txns.filter(q=>q.accId===x.accId&&q.kind==='transfer_in'&&inRange(q,f,t)),tBase);rows.push({name:c?c.name:'Card',icon:'💳',plan:x.amount,act,sec:'Credit Card Payments'})});
  pl.goals.forEach(x=>{const g=S.goals.find(y=>y.id===x.goalId);const act=g?sum(g.contributions.filter(q=>inRange(q,f,t)&&q.amount>0),q=>q.amount):0;rows.push({name:g?g.name:'Goal',icon:g?.icon||'🎯',plan:x.amount,act,sec:'Saving Goals'})});
  const tot=planTotal(pl),act=sum(rows,r=>r.act);const secs=[...new Set(rows.map(r=>r.sec))];
  return {top:hdr('Monthly Overview',{center:true}),html:`<div class="pad stack">${L.length>1?`<div class="chips">${L.map(x=>`<button class="chip ${x.id===pl.id?'on':''}" data-a="ovplan" data-id="${x.id}">${esc(x.name)} · ${fM(x.month)}</button>`).join('')}</div>`:''}
   <div class="card"><b style="font-size:calc(16px*var(--fs))">Summary</b><div class="tiny muted">${esc(pl.name)} · ${fML(pl.month)}</div>${[['Total Salary',pl.income,'green'],['Total Allocated',tot,''],['Total Actual',act,''],['Remaining Unallocated',pl.income-tot,pl.income-tot<0?'red':'green']].map(([k,v,c])=>`<div class="kv"><span>${k}</span><b class="num ${c}">${B(v)}</b></div>`).join('')}</div>
   ${secs.map(sc=>`<span class="h2">${sc}</span>${rows.filter(r=>r.sec===sc).map(r=>{const p=r.plan?r.act/r.plan:0;return `<div class="card stack s8"><div class="between"><b>${r.icon} ${esc(r.name)}</b><span class="badge ${p>1?'red':'green'}">${Math.round(p*100)}%</span></div>${prog(p,p>1?'r':'')}<div class="g3 tiny"><div><span class="muted">Planned</span><div class="b num">${B(r.plan)}</div></div><div style="text-align:center"><span class="muted">Actual</span><div class="b num">${B(r.act)}</div></div><div style="text-align:right"><span class="muted">Remaining</span><div class="b num ${r.plan-r.act<0?'red':'green'}">${B(r.plan-r.act)}</div></div></div></div>`}).join('')}`).join('')||'<div class="card small muted">This plan has no allocations yet.</div>'}</div>`,fab:false};
};
